    run:     {at: [1, 0], uc: U4.2, action: basic.run, label: RUN}
    load:    {at: [1, 1], uc: U4.2, action: basic.run, value: {command: 'LOAD ""'}, label: LOAD}
    new:     {at: [1, 2], uc: U4.2, action: basic.clear, label: NEW}
    cat:     {at: [2, 0], uc: U4.3, action: input.macro, value: {name: cat}, label: CAT}
    format:  {at: [2, 1], uc: U4.3, action: input.macro, value: {name: format}, label: FORMAT}
    erase:   {at: [2, 2], uc: U4.3, action: input.macro, value: {name: erase}, label: ERASE}
