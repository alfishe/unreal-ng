  uc: U1
  glyph: input.joystick
  context: play
  keys:
    kemp:    {at: [0, 1], uc: U1.3, action: input.joystick_type, value: {kind: kempston}, label: KEMP}
    sinc1:   {at: [0, 2], uc: U1.3, action: input.joystick_type, value: {kind: sinclair1}, label: SINC1}
    sinc2:   {at: [0, 3], uc: U1.3, action: input.joystick_type, value: {kind: sinclair2}, label: SINC2}
    cursor:  {at: [0, 4], uc: U1.3, action: input.joystick_type, value: {kind: cursor}, label: CURSOR}
    mouse:   {at: [0, 5], uc: U1.5, action: feature.toggle, value: {name: kempstonmouse}, label: MOUSE}
    joynow:  {at: [0, 6], uc: U1.3, label: JOYSTICK, show: {readout: input.connectors.connectors.0.kind, format: '{}'}}
    release: {at: [0, 8], uc: U1.4, action: input.release_all}
    space:   {at: [1, 0], uc: U1.4, action: input.key, value: {key: space, hold: true}, hold: true, label: SPACE}
    enter:   {at: [1, 1], uc: U1.4, action: input.key, value: {key: enter, hold: true}, hold: true, label: ENTER}
    brk:     {at: [1, 2], uc: U1.4, action: input.key, value: {key: caps+space, hold: true}, hold: true, label: BREAK}
    up:      {at: [1, 6], uc: U1.2, action: input.joystick, value: {buttons: up, hold: true}, hold: true, label: UP}
    fire:    {at: [1, 8], uc: U1.2, action: input.joystick, value: {buttons: fire, hold: true}, hold: true, label: FIRE}
    keyy:    {at: [2, 0], uc: U1.4, action: input.key, value: {key: y, hold: true}, hold: true, label: Y}
    keyn:    {at: [2, 1], uc: U1.4, action: input.key, value: {key: n, hold: true}, hold: true, label: N}
    left:    {at: [2, 5], uc: U1.2, action: input.joystick, value: {buttons: left, hold: true}, hold: true, label: LEFT}
    down:    {at: [2, 6], uc: U1.2, action: input.joystick, value: {buttons: down, hold: true}, hold: true, label: DOWN}
    right:   {at: [2, 7], uc: U1.2, action: input.joystick, value: {buttons: right, hold: true}, hold: true, label: RIGHT}
    k1:      {at: [3, 0], uc: U1.4, action: input.key, value: {key: '1', hold: true}, hold: true, label: '1'}
    k2:      {at: [3, 1], uc: U1.4, action: input.key, value: {key: '2', hold: true}, hold: true, label: '2'}
    k3:      {at: [3, 2], uc: U1.4, action: input.key, value: {key: '3', hold: true}, hold: true, label: '3'}
    k4:      {at: [3, 3], uc: U1.4, action: input.key, value: {key: '4', hold: true}, hold: true, label: '4'}
    gamback5: {at: [3, 7], uc: U2.2, action: ttd.unit_back, value: {unit: seconds, count: 5}, label: -5S}
    gamqload: {at: [3, 8], uc: U2.4, action: snapshot.quick, value: {op: load, slot: 1}, label: L1}

