# C8.3: the AY channels, a column per channel of the three chips (mute above, solo below); the dials set A, B, C of AY1.
# +-- screen ay: AY channels (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      .          .          .          .          .          .          .          .
# 1 | 1A         1B         1C         2A         2B         2C         3A         3B         3C
# 2 | 1A         1B         1C         2A         2B         2C         3A         3B         3C
# 3 | .          .          .          .          .          .          .          .          .
# dial 0 AY1 A: turn audio.volume_by, press audio.source_mute
# dial 1 AY1 B: turn audio.volume_by, press audio.source_mute
# dial 2 AY1 C: turn audio.volume_by, press audio.source_mute
# dial 3 AY2 A: turn audio.volume_by, press audio.source_mute
# dial 4 AY2 B: turn audio.volume_by, press audio.source_mute
# dial 5 AY2 C: turn audio.volume_by, press audio.source_mute
# +--
menu ay:
  title: AY channels
  label: AY CHANS
  uc: C8.3
  glyph: audio.sound
  dials:
    0: {label: AY1 A, uc: C8.3, turn: {action: audio.volume_by, value: {d: $ticks, source: ay1.a}}, press: {action: audio.source_mute, value: {source: ay1.a}}}
    1: {label: AY1 B, uc: C8.3, turn: {action: audio.volume_by, value: {d: $ticks, source: ay1.b}}, press: {action: audio.source_mute, value: {source: ay1.b}}}
    2: {label: AY1 C, uc: C8.3, turn: {action: audio.volume_by, value: {d: $ticks, source: ay1.c}}, press: {action: audio.source_mute, value: {source: ay1.c}}}
    3: {label: AY2 A, uc: C8.3, turn: {action: audio.volume_by, value: {d: $ticks, source: ay2.a}}, press: {action: audio.source_mute, value: {source: ay2.a}}}
    4: {label: AY2 B, uc: C8.3, turn: {action: audio.volume_by, value: {d: $ticks, source: ay2.b}}, press: {action: audio.source_mute, value: {source: ay2.b}}}
    5: {label: AY2 C, uc: C8.3, turn: {action: audio.volume_by, value: {d: $ticks, source: ay2.c}}, press: {action: audio.source_mute, value: {source: ay2.c}}}
  keys:
    m1a:     {at: [1, 0], uc: C8.3, action: audio.source_mute, value: {source: ay1.a}, label: 1A}
    m1b:     {at: [1, 1], uc: C8.3, action: audio.source_mute, value: {source: ay1.b}, label: 1B}
    m1c:     {at: [1, 2], uc: C8.3, action: audio.source_mute, value: {source: ay1.c}, label: 1C}
    m2a:     {at: [1, 3], uc: C8.3, action: audio.source_mute, value: {source: ay2.a}, label: 2A}
    m2b:     {at: [1, 4], uc: C8.3, action: audio.source_mute, value: {source: ay2.b}, label: 2B}
    m2c:     {at: [1, 5], uc: C8.3, action: audio.source_mute, value: {source: ay2.c}, label: 2C}
    m3a:     {at: [1, 6], uc: C8.3, action: audio.source_mute, value: {source: ay3.a}, label: 3A}
    m3b:     {at: [1, 7], uc: C8.3, action: audio.source_mute, value: {source: ay3.b}, label: 3B}
    m3c:     {at: [1, 8], uc: C8.3, action: audio.source_mute, value: {source: ay3.c}, label: 3C}
    s1a:     {at: [2, 0], uc: C8.3, action: audio.source_solo, value: {source: ay1.a}, label: 1A}
    s1b:     {at: [2, 1], uc: C8.3, action: audio.source_solo, value: {source: ay1.b}, label: 1B}
    s1c:     {at: [2, 2], uc: C8.3, action: audio.source_solo, value: {source: ay1.c}, label: 1C}
    s2a:     {at: [2, 3], uc: C8.3, action: audio.source_solo, value: {source: ay2.a}, label: 2A}
    s2b:     {at: [2, 4], uc: C8.3, action: audio.source_solo, value: {source: ay2.b}, label: 2B}
    s2c:     {at: [2, 5], uc: C8.3, action: audio.source_solo, value: {source: ay2.c}, label: 2C}
    s3a:     {at: [2, 6], uc: C8.3, action: audio.source_solo, value: {source: ay3.a}, label: 3A}
    s3b:     {at: [2, 7], uc: C8.3, action: audio.source_solo, value: {source: ay3.b}, label: 3B}
    s3c:     {at: [2, 8], uc: C8.3, action: audio.source_solo, value: {source: ay3.c}, label: 3C}

# C9: the picture. Row 0 the window, row 1 the CRT (on / off, the profile, back to basic), row 2 the temporal effects (one switch, then the effect: blending or ZX DLSS), row 3 HUD and the keyboard.
# +-- screen picture: Picture (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      PICFULL    SCALE      GPU        BORDER     CROP       .          TOOLBAR    STATUS
# 1 | CRT        PROFILE    CRT BASIC  .          .          .          .          .          .
# 2 | TEMPORAL   EFFECT     .          .          .          .          .          .          .
# 3 | HUD        HUD LOOK   .          KEYBOARD   KB LOOK    .          .          .          .
# dial 0 DECAY: turn video.blending_decay_by, press video.temporal_toggle
# +--
menu picture:
  title: Picture
  label: PICTURE
  uc: C9
  glyph: video.menu
  dials:
    0: {label: DECAY, uc: C9.5, turn: {action: video.blending_decay_by, value: {d: $ticks}}, press: {action: video.temporal_toggle}}
  keys:
    picfull: {at: [0, 1], uc: C9.1, action: view.fullscreen}
    scale:   {at: [0, 2], uc: C9.1, action: view.scale, value: {scale: next}, label: SCALE}
    gpu:     {at: [0, 3], uc: C9.2, action: video.gpu_toggle, label: GPU}
    over:    {at: [0, 4], uc: C9.3, action: video.overscan_toggle, label: BORDER}
    vport:   {at: [0, 5], uc: C9.3, action: video.viewport, value: {viewport: next}, label: CROP, show: {readout: video.viewport.viewport, format: '{}'}}
    toolbar: {at: [0, 7], uc: C9.8, action: view.toolbar, label: TOOLBAR}
    status:  {at: [0, 8], uc: C9.8, action: view.status_bar, label: STATUS}
    crt:     {at: [1, 0], uc: C9.4, action: video.crt_toggle, label: CRT}
    crtnext: {at: [1, 1], uc: C9.4, action: video.crt_profile, value: {profile: next}, label: PROFILE, show: {readout: video.window.crt_profile, format: '{}'}}
    crtbasic: {at: [1, 2], uc: C9.4, action: video.crt_profile, value: {profile: basic}, label: CRT BASIC}
    temporal: {at: [2, 0], uc: C9.5, action: video.temporal_toggle, label: TEMPORAL}
    teffect: {at: [2, 1], uc: C9.5, action: video.temporal_effect, value: {effect: next}, label: EFFECT, show: {readout: video.temporal.dlss, format: '{?ZX DLSS|BLEND}'}}
    hud:     {at: [3, 0], uc: C9.6, action: hud.toggle, label: HUD}
    hudth:   {at: [3, 1], uc: C9.6, action: hud.theme, value: {theme: next}, label: HUD LOOK}
    osdkb:   {at: [3, 3], uc: C9.7, action: osd.keyboard, label: KEYBOARD}
    osdpic:  {at: [3, 4], uc: C9.7, action: osd.keyboard_picture, value: {picture: next}, label: KB LOOK}

# C10: monitoring, read-only (a press changes nothing): value keys show the readouts (row 0 the instances and the host,
# row 1 the emulation and the peripherals, row 2 breakpoints, labels and time travel, row 3 the profilers and
# recording).
# +-- screen monitor: Monitoring (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      COUNT      MODEL      STATE      CPU        MEMORY     THREADS    CLIENTS    PAIRED
# 1 | FPS        SPEED      BUDGET     WORK US    MHZ        INT/FR     MEDIA      PLUGGED    AUDIO
# 2 | .          .          BPS        HIT AT     LABELS     TTD        FRAMES     TTD MEM    MARKS
# 3 | >BUFFERS   .          OPCODES    CALLS      COVER      RECORD     LENGTH     SIZE       VIDEO
# opens: [3,0] buffers
# +--
menu monitor:
  title: Monitoring
  label: MONITOR
  uc: C10
  glyph: analyzer.toggle.on
  strip: {content: title, status: ttd, target: true}
  keys:
    inst:    {at: [0, 1], uc: C10.1, label: COUNT, show: {readout: host.clients.instances}}
    model:   {at: [0, 2], uc: C10.1, label: MODEL, show: {readout: machine.model}}
    runst:   {at: [0, 3], uc: C10.1, label: STATE, show: {readout: run.state.state}}
    cpu:     {at: [0, 4], uc: C10.2, label: CPU, show: {readout: host.stats.cpu_percent, format: "{:.0f}%", warn: 100, alert: 200}}
    mem:     {at: [0, 5], uc: C10.2, label: MEMORY, show: {readout: host.stats.rss_bytes, format: "{:b}"}}
    threads: {at: [0, 6], uc: C10.2, label: THREADS, show: {readout: host.stats.threads}}
    clients: {at: [0, 7], uc: C10.10, label: CLIENTS, show: {readout: host.clients, format: "{ws.connections} WS\n{mcp.connections} MCP"}}
    paired:  {at: [0, 8], uc: C10.10, label: PAIRED, show: {readout: host.clients.companions}}
    fps:     {at: [1, 0], uc: C10.3, label: FPS, show: {readout: emulator.stats.fps, format: "{:.1f}"}}
    spdpct:  {at: [1, 1], uc: C10.3, label: SPEED, show: {readout: emulator.stats.speed_percent, format: "{:.0f}%", warn: 95, alert: 80}}
    budget:  {at: [1, 2], uc: C10.3, label: BUDGET, show: {readout: emulator.stats.frame_budget_percent, format: "{:.0f}%", warn: 80, alert: 100}}
    ftime:   {at: [1, 3], uc: C10.3, label: WORK US, show: {readout: emulator.stats.frame_time_us.avg, format: "{:.0f}"}}
    mhz:     {at: [1, 4], uc: C10.3, label: MHZ, show: {readout: emulator.stats.cpu.mhz, format: "{:.2f}"}}
    ints:    {at: [1, 5], uc: C10.3, label: INT/FR, show: {readout: emulator.stats.interrupts_per_frame, format: "{:.0f}"}}
    slots:   {at: [1, 6], uc: C10.4, label: MEDIA, show: {readout: media.slots, format: "{loaded}/{slots:#}"}}
    pads:    {at: [1, 7], uc: C10.4, label: PLUGGED, show: {readout: controllers.state.plugged}}
    audio:   {at: [1, 8], uc: C10.4, label: AUDIO, show: {readout: audio.mixer, format: "{master.muted?MUTED|ON}"}}
    bps:     {at: [2, 2], uc: C10.5, label: BPS, show: {readout: debug.breakpoints, format: "{active}/{total}"}}
    lasthit: {at: [2, 3], uc: C10.5, label: HIT AT, show: {readout: debug.breakpoints.last_hit.address, format: "{:04X}"}}
    lblcnt:  {at: [2, 4], uc: C10.6, label: LABELS, show: {readout: debug.labels.total, format: "{:k}"}}
    ttdst:   {at: [2, 5], uc: C10.7, label: TTD, show: {readout: ttd.status, format: "{recording?REC|IDLE}", warn: 1}}
    ttdlen:  {at: [2, 6], uc: C10.7, label: FRAMES, show: {readout: ttd.status.frames, format: "{:k}"}}
    ttdmem:  {at: [2, 7], uc: C10.7, label: TTD MEM, show: {readout: ttd.status.memory_bytes, format: "{:b}"}}
    marks:   {at: [2, 8], uc: C10.7, label: MARKS, show: {readout: ttd.status.bookmarks}}
    buffers: {at: [3, 0], open: buffers}
    opcodes: {at: [3, 2], uc: C10.8, label: OPCODES, show: {readout: debug.analyzers.opcode}}
    calls:   {at: [3, 3], uc: C10.8, label: CALLS, show: {readout: debug.analyzers.calltrace}}
    covins:  {at: [3, 4], uc: C10.8, label: COVER, show: {readout: debug.analyzers.coverage.instructions, format: "{:k}"}}
    rec:     {at: [3, 5], uc: C10.9, label: RECORD, show: {readout: recording.state, format: "{recording?REC|IDLE}", warn: 1}}
    rectime: {at: [3, 6], uc: C10.9, label: LENGTH, show: {readout: recording.state.duration_s, format: "{:.0f}S"}}
    recsize: {at: [3, 7], uc: C10.9, label: SIZE, show: {readout: recording.state.file_bytes, format: "{:b}"}}
    video:   {at: [3, 8], uc: C10.9, label: VIDEO, show: {readout: cap.record, format: "{recording?REC|IDLE}", warn: 1}}

# C10.8: how full each trace buffer is (read-only): slots used of the capacity, the bytes they take under it. Row 0 the
# CPU's traces, row 1 the ports and the sound, row 2 time travel.
