# D1, D3: time. Row 0 the pace, rows 1-2 the history in units, row 3 bookmarks and the search.
# +-- screen time: Time (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      25FPS      5FPS       1FPS       LINE       OP         PACE       STOP       FULL
# 1 | START      -FRAME     -LINE      -OP        .          +OP        +LINE      +FRAME     END
# 2 | REV RUN    REV STEP   .          BACK       FRAME      FORWARD    .          .          LIVE
# 3 | MARK <     MARK       MARK >     MARKS      .          WRITE      READ       EXEC       TTD REC
# dial 0 FRAMES: turn ttd.jog_frames, press run.pause_toggle
# dial 1 SCRUB: turn ttd.seek_by, press run.pause_toggle
# dial 2 LINES: turn run.step_by, press run.to_pixel
# dial 3 T-STATES: turn run.step_by, press run.wait_int
# dial 4 PACE: turn run.pace_by, press run.pace_toggle
# +--
menu time:
  title: Time
  label: TIME
  uc: [D1, D3]
  glyph: ttd.menu
  context: ttd
  strip: {content: title, status: ttd, target: true}
  dials:
    0: {label: FRAMES, uc: D3.3, turn: {action: ttd.jog_frames, value: {d: $ticks}}, press: {action: run.pause_toggle}}
    1: {label: SCRUB, uc: D3.2, turn: {action: ttd.seek_by, value: {d: $ticks, rate: $rate}}, press: {action: run.pause_toggle}}
    2: {label: LINES, uc: D2.4, turn: {action: run.step_by, value: {d: $ticks, unit: scanlines}}, press: {action: run.to_pixel}}
    3: {label: T-STATES, uc: D2.5, turn: {action: run.step_by, value: {d: $ticks, unit: tstates}}, press: {action: run.wait_int}}
    4: {label: PACE, uc: D1.1, turn: {action: run.pace_by, value: {d: $ticks}}, press: {action: run.pace_toggle}}
  keys:
    p25:     {at: [0, 1], uc: D1.1, action: run.pace_set, value: {preset: 25fps}, label: 25FPS}
    p5:      {at: [0, 2], uc: D1.1, action: run.pace_set, value: {preset: 5fps}, label: 5FPS}
    p1:      {at: [0, 3], uc: D1.1, action: run.pace_set, value: {preset: 1fps}, label: 1FPS}
    pline:   {at: [0, 4], uc: D1.1, action: run.pace_set, value: {preset: 1line}, label: LINE}
    pop:     {at: [0, 5], uc: D1.1, action: run.pace_set, value: {preset: 1op}, label: OP}
    pstep:   {at: [0, 6], uc: D1.2, action: run.pace_step, label: PACE, show: {readout: run.state.pace.label, format: '{}'}}
    pstop:   {at: [0, 7], uc: D1.2, action: run.pace_stop, label: STOP}
    pfull:   {at: [0, 8], uc: D1.1, action: run.pace_set, value: {preset: full}, label: FULL}
    start:   {at: [1, 0], uc: D3.4, action: ttd.seek_start}
    bframe:  {at: [1, 1], uc: D3.3, action: ttd.step_back_frame, label: -FRAME}
    bline:   {at: [1, 2], uc: D3.3, action: ttd.step_back_scanline, label: -LINE}
    bop:     {at: [1, 3], uc: D3.3, action: ttd.step_back_instruction, label: -OP}
    fop:     {at: [1, 5], uc: D3.3, action: ttd.step_forward_instruction, label: +OP}
    fline:   {at: [1, 6], uc: D3.3, action: ttd.step_forward_scanline, label: +LINE}
    fframe:  {at: [1, 7], uc: D3.3, action: ttd.step_forward_frame, label: +FRAME}
    end:     {at: [1, 8], uc: D3.4, action: ttd.seek_end}
    rcont:   {at: [2, 0], uc: D3.5, action: ttd.reverse_continue, label: REV RUN}
    rstep:   {at: [2, 1], uc: D3.5, action: ttd.reverse_step, label: REV STEP}
    uback:   {at: [2, 3], uc: D3.3, action: ttd.unit_back, label: BACK}
    tframe:  {at: [2, 4], uc: D3.2, label: FRAME, show: {readout: ttd.position.current.frame, format: '{}'}}
    ufwd:    {at: [2, 5], uc: D3.3, action: ttd.unit_forward, label: FORWARD}
    timlive: {at: [2, 8], uc: D3.6, action: ttd.resume_live, label: LIVE}
    bmprev:  {at: [3, 0], uc: D3.7, action: ttd.bookmark_prev, label: MARK <}
    bmadd:   {at: [3, 1], uc: D3.7, action: ttd.bookmark_add, label: MARK}
    bmnext:  {at: [3, 2], uc: D3.7, action: ttd.bookmark_next, label: MARK >}
    bmlist:  {at: [3, 3], uc: D3.7, action: ttd.bookmarks, label: MARKS}
    lastw:   {at: [3, 5], uc: D5.1, action: ttd.find_last_write, label: WRITE}
    lastr:   {at: [3, 6], uc: D5.1, action: ttd.find_last, value: {access: read}, label: READ}
    laste:   {at: [3, 7], uc: D5.1, action: ttd.find_last, value: {access: execute}, label: EXEC}
    timttdrec: {at: [3, 8], uc: C7.1, action: ttd.record_toggle, label: TTD REC}

# D2, D4, D6, D8, D10: the debugger. Row 0 pause and the steps, row 1 breakpoints, row 2 the panes, row 3 symbols and profilers.
# +-- screen debug: Debugger (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      DEBPAUSE   STEP IN    STEP OVER  STEP OUT   TO CURSOR  TO INT     FRAME      LINE
# 1 | BP PC      BP CUR     OUT FE     7FFD       BPS ON     CLEAR BP   HITS 0     TO PIXEL   DEBUG MOD
# 2 | SHOW DEBU  PANE <     PANE >     PGUP       CUP        PGDN       FOLLOW     MEM PC     LABELS
# 3 | LOAD SYM   LIVE SYM   SAVE SYM   CLEFT      CDOWN      CRIGHT     PROF OPS   COVERAGE   CALLS
# dial 0 STEP: turn run.step_by, press run.step_in
# dial 1 FRAMES: turn run.step_by, press run.frame_step
# +--
menu debug:
  title: Debugger
  label: DEBUG
  uc: [D2, D4, D6, D8, D10]
  glyph: dbg.mode
  context: debug
  dials:
    0: {label: STEP, uc: D2.2, turn: {action: run.step_by, value: {d: $ticks, unit: instructions}}, press: {action: run.step_in}}
    1: {label: FRAMES, uc: D2.3, turn: {action: run.step_by, value: {d: $ticks, unit: frames}}, press: {action: run.frame_step}}
  keys:
    debpause: {at: [0, 1], uc: C1.1, action: run.pause_toggle}
    debstepin: {at: [0, 2], uc: D2.1, action: run.step_in, label: STEP IN}
    debstepovr: {at: [0, 3], uc: D2.1, action: run.step_over, label: STEP OVER}
    debstepout: {at: [0, 4], uc: D2.1, action: run.step_out, label: STEP OUT}
    debcursor: {at: [0, 5], uc: D2.6, action: run.to_cursor, label: TO CURSOR}
    int:     {at: [0, 6], uc: D2.3, action: run.wait_int, label: TO INT}
    debframe: {at: [0, 7], uc: D2.3, action: run.frame_step, label: FRAME}
    line:    {at: [0, 8], uc: D2.7, action: run.step_line, label: LINE}
    debbppc: {at: [1, 0], uc: D4.1, action: dbg.breakpoint_toggle_pc, label: BP PC}
    bpcur:   {at: [1, 1], uc: D4.1, action: dbg.breakpoint_toggle_cursor, label: BP CUR}
    bpfe:    {at: [1, 2], uc: D4.2, action: dbg.bp_add, value: {kind: out, preset: fe}, label: OUT FE}
    bp7ffd:  {at: [1, 3], uc: D4.2, action: dbg.bp_add, value: {kind: out, preset: 7ffd}, label: 7FFD}
    bpall:   {at: [1, 4], uc: D4.3, action: dbg.bp_toggle, label: BPS ON}
    debbpclear: {at: [1, 5], uc: D4.3, action: dbg.breakpoints_clear, label: CLEAR BP}
    debbphits: {at: [1, 6], uc: D4.3, action: dbg.breakpoint_hits_reset, label: HITS 0}
    pixel:   {at: [1, 7], uc: D2.4, action: run.to_pixel, label: TO PIXEL}
    debdbgmode: {at: [1, 8], uc: D4.4, action: dbg.mode_toggle, label: DEBUG MODE}
    open:    {at: [2, 0], uc: D6.1, action: dbg.open, label: SHOW DEBUG}
    pprev:   {at: [2, 1], uc: D6.1, action: dbg.focus_prev_pane, label: PANE <}
    pnext:   {at: [2, 2], uc: D6.1, action: dbg.focus_next_pane, label: PANE >}
    pgup:    {at: [2, 3], uc: D6.2, action: dbg.page_up}
    cup:     {at: [2, 4], uc: D6.2, action: dbg.cursor_up}
    pgdn:    {at: [2, 5], uc: D6.2, action: dbg.page_down}
    follow:  {at: [2, 6], uc: D6.4, action: dbg.follow_pc, label: FOLLOW}
    memf:    {at: [2, 7], uc: D6.3, action: dbg.memory_follow, label: MEM PC}
    labels:  {at: [2, 8], uc: D6.4, action: dbg.labels_toggle, label: LABELS}
    symload: {at: [3, 0], uc: D8.2, action: sym.import, value: {path: $user/build/main.sym}, label: LOAD SYM}
    symlive: {at: [3, 1], uc: D8.2, action: sym.import_live, label: LIVE SYM}
    symsave: {at: [3, 2], uc: D8.2, action: sym.export, value: {path: $user/build/deck.sym}, label: SAVE SYM}
    cleft:   {at: [3, 3], uc: D6.2, action: dbg.cursor_left}
    cdown:   {at: [3, 4], uc: D6.2, action: dbg.cursor_down}
    cright:  {at: [3, 5], uc: D6.2, action: dbg.cursor_right}
    prof:    {at: [3, 6], uc: D10.1, action: prof.toggle, value: {name: opcode}, label: PROF OPS}
    cover:   {at: [3, 7], uc: D10.1, action: prof.toggle, value: {name: coverage}, label: COVERAGE}
    trace:   {at: [3, 8], uc: D10.1, action: prof.toggle, value: {name: calltrace}, label: CALLS}
