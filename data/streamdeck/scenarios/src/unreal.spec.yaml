# D1, D3: time. Row 0 the pace, rows 1-2 the history in units, row 3 bookmarks and the search.
menu time:
  title: Time
  uc: [D1, D3]
  glyph: ttd.menu
  strip: {content: title, status: ttd, target: true}
  dials:
    0: {label: SCRUB, uc: D3.2, turn: {action: ttd.seek_by, value: {d: $ticks, rate: $rate}}, press: {action: ttd.resume_live}}
    1: {label: PACE, uc: D1.1, turn: {action: run.pace_by, value: {d: $ticks}}, press: {action: run.pace_toggle}}
    2: {label: LINES, uc: D2.4, turn: {action: run.step_by, value: {d: $ticks, unit: scanlines}}, press: {action: run.to_pixel}}
    3: {label: T-STATES, uc: D2.5, turn: {action: run.step_by, value: {d: $ticks, unit: tstates}}, press: {action: run.wait_int}}
  keys:
    p25:     {at: [0, 1], uc: D1.1, action: run.pace_set, value: {preset: 25fps}, label: 25FPS}
    p5:      {at: [0, 2], uc: D1.1, action: run.pace_set, value: {preset: 5fps}, label: 5FPS}
    p1:      {at: [0, 3], uc: D1.1, action: run.pace_set, value: {preset: 1fps}, label: 1FPS}
    pline:   {at: [0, 4], uc: D1.1, action: run.pace_set, value: {preset: 1line}, label: LINE}
    pop:     {at: [0, 5], uc: D1.1, action: run.pace_set, value: {preset: 1op}, label: OP}
    pstep:   {at: [0, 6], uc: D1.2, action: run.pace_step, label: PACE, show: {readout: run.state.pace.label, format: '{}'}}
    pstop:   {at: [0, 7], uc: D1.2, action: run.pace_stop}
    pfull:   {at: [0, 8], uc: D1.1, action: run.pace_set, value: {preset: full}, label: FULL}
    start:   {at: [1, 0], uc: D3.4, action: ttd.seek_start}
    bframe:  {at: [1, 1], uc: D3.3, action: ttd.step_back_frame}
    bline:   {at: [1, 2], uc: D3.3, action: ttd.step_back_scanline}
    bop:     {at: [1, 3], uc: D3.3, action: ttd.step_back_instruction}
    fop:     {at: [1, 5], uc: D3.3, action: ttd.step_forward_instruction}
    fline:   {at: [1, 6], uc: D3.3, action: ttd.step_forward_scanline}
    fframe:  {at: [1, 7], uc: D3.3, action: ttd.step_forward_frame}
    end:     {at: [1, 8], uc: D3.4, action: ttd.seek_end}
    rcont:   {at: [2, 0], uc: D3.5, action: ttd.reverse_continue}
    rstep:   {at: [2, 1], uc: D3.5, action: ttd.reverse_step}
    uback:   {at: [2, 3], uc: D3.3, action: ttd.unit_back}
    tframe:  {at: [2, 4], uc: D3.2, label: FRAME, show: {readout: ttd.position.current.frame, format: '{}'}}
    ufwd:    {at: [2, 5], uc: D3.3, action: ttd.unit_forward}
    timlive: {at: [2, 8], uc: D3.6, action: ttd.resume_live}
    bmprev:  {at: [3, 0], uc: D3.7, action: ttd.bookmark_prev}
    bmadd:   {at: [3, 1], uc: D3.7, action: ttd.bookmark_add}
    bmnext:  {at: [3, 2], uc: D3.7, action: ttd.bookmark_next}
    bmlist:  {at: [3, 3], uc: D3.7, action: ttd.bookmarks}
    lastw:   {at: [3, 5], uc: D5.1, action: ttd.find_last_write}
    lastr:   {at: [3, 6], uc: D5.1, action: ttd.find_last, value: {access: read}, label: READ}
    laste:   {at: [3, 7], uc: D5.1, action: ttd.find_last, value: {access: execute}, label: EXEC}
    timttdrec: {at: [3, 8], uc: C7.1, action: ttd.record_toggle}

# D2, D4, D6, D8, D10: the debugger. Row 0 steps, row 1 breakpoints, row 2 the panes, row 3 symbols and profilers.
