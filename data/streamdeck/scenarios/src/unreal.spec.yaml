# 0 | <BACK      OPCODES    CALLS      CALLS HOT  PC HIST    COVERAGE   .          .          .
# 1 | .          PORTS      GS PORTS   AY LOG     .          .          .          .          .
# 2 | .          TTD HIST   TTD MEM    JOURNAL    CHECKPTS   .          .          .          .
# 3 | .          .          .          .          .          .          .          .          .
