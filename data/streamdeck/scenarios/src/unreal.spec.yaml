# The product scenario for the Stream Deck + XL (4 x 9 keys, 6 dials, the strip): the use cases of
# docs/inprogress/2026-10-19-streamdeck-integration/use-cases.md. Format and commands: docs/companions/streamdeck/pipeline.md
#
# Home holds what every session needs in fixed places, the user's keys above the programmer's: row 0 running the
# machine, row 1 loading and saving (states, media, the tape), then the game and BASIC, row 2 the settings pages
# (machine, sound, picture) and capture last, row 3 the debugger and time pages, the history (rewind, live, recording,
# a bookmark) and monitoring in the last corner (stepping and breakpoints live in the debugger page). Every page keeps
# the back key at [0, 0]; the TTD timeline is on the strip.
scenario: unreal
model: plusxl
settings: {brightness: 60, activity: {ignore: [ttd.seek_by, audio.volume_by, run.pace_by, run.step_by, ttd.jog_frames, ttd.jog_instructions]}}

# +-- screen home: Home (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | PAUSE      RESET      NMI        TURBO      HOLD       X1         >SPEED     MUTE       FULL
# 1 | S1         L1         >STATE     >MEDIA     TAPE       LAST FILE  .          >GAME      >BASIC
# 2 | >MODEL     >SOUND     >PICTURE   .          .          .          SHOT       VIDEO REC  AUDIO REC
# 3 | >DEBUG     >TIME      .          -5S        LIVE       TTD REC    MARK       .          >MONITOR
# opens: [0,6] speed, [1,2] state, [1,3] media, [1,7] game, [1,8] basic, [2,0] machine, [2,1] sound, [2,2] picture
#        [3,0] debug, [3,1] time, [3,8] monitor
# dial 0 FRAMES: turn ttd.jog_frames, press run.pause_toggle
# dial 1 TIME: turn ttd.seek_by, press run.pause_toggle
# dial 2 OPS: turn ttd.jog_instructions, press ttd.resume_live
# dial 3 PACE: turn run.pace_by, press run.pace_toggle
# dial 5 VOLUME: turn audio.volume_by, press audio.mute_toggle
# +--
menu home:
  title: Home
  context: play
  strip: {content: title, status: ttd, target: true}
  dials:
    0: {label: FRAMES, uc: D3.3, turn: {action: ttd.jog_frames, value: {d: $ticks}}, press: {action: run.pause_toggle}}
    1: {label: TIME, uc: [U2.1, D3.2], turn: {action: ttd.seek_by, value: {d: $ticks, rate: $rate, unit: seconds, min: 1, max: 50}}, press: {action: run.pause_toggle}}
    2: {label: OPS, uc: D3.3, turn: {action: ttd.jog_instructions, value: {d: $ticks}}, press: {action: ttd.resume_live}}
    3: {label: PACE, uc: D1.1, turn: {action: run.pace_by, value: {d: $ticks}}, press: {action: run.pace_toggle}}
    5: {label: VOLUME, uc: C8.2, turn: {action: audio.volume_by, value: {d: $ticks}}, press: {action: audio.mute_toggle}}
  keys:
    # C1, C2, C8.1, C9.1: running the machine, the speed, mute and full screen
    pause:   {at: [0, 0], uc: C1.1, action: run.pause_toggle}
    reset:   {at: [0, 1], uc: C1.2, action: mach.reset}
    nmi:     {at: [0, 2], uc: C1.3, action: mach.nmi, label: NMI}
    turbo:   {at: [0, 3], uc: C2.2, action: mach.turbo_toggle, label: TURBO}
    hold:    {at: [0, 4], uc: C2.2, action: run.turbo_hold, label: HOLD}
    x1:      {at: [0, 5], uc: C2.5, action: set.speed, value: {value: 1}, label: X1, show: {readout: run.state.speed, format: 'X{}'}}
    speed:   {at: [0, 6], open: speed}
    mute:    {at: [0, 7], uc: C8.1, action: audio.mute_toggle}
    full:    {at: [0, 8], uc: C9.1, action: view.fullscreen}
    # C6, C4: loading and saving (quick slots, states, media, the tape, the last file); U1, U4: the game and BASIC
    qsave:   {at: [1, 0], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 1}, label: S1}
    qload:   {at: [1, 1], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 1}, label: L1}
    state:   {at: [1, 2], open: state}
    media:   {at: [1, 3], open: media}
    tape:    {at: [1, 4], uc: C4.2, action: media.tape, value: {op: toggle}, label: TAPE, show: {readout: media.tape, format: '{block}/{blocks}'}}
    recent:  {at: [1, 5], uc: C4.3, action: media.open_recent, value: {index: 0}, label: LAST FILE}
    game:    {at: [1, 7], open: game}
    basic:   {at: [1, 8], open: basic}
    # C3, C8, C9: the settings pages; C7: capture last (the screenshot, video and audio recording)
    machine: {at: [2, 0], open: machine}
    sound:   {at: [2, 1], open: sound}
    picture: {at: [2, 2], open: picture}
    shot:    {at: [2, 6], uc: C7.5, action: cap.screenshot}
    vrec:    {at: [2, 7], uc: C7.2, action: cap.record_toggle, value: {preset: gameplay}, label: VIDEO REC}
    arec:    {at: [2, 8], uc: C7.2a, action: cap.record_toggle, value: {preset: music}, label: AUDIO REC}
    # D2, D4, D6, D1, D3: the programmer's pages; U2, C7.1, D3.7: rewind, the history recording, a bookmark;
    # C10: monitoring in the last corner
    debug:   {at: [3, 0], open: debug}
    time:    {at: [3, 1], open: time}
    back5:   {at: [3, 3], uc: U2.2, action: ttd.unit_back, value: {unit: seconds, count: 5}, label: -5S}
    live:    {at: [3, 4], uc: [U2.3, D3.6], action: ttd.resume_live, label: LIVE}
    ttdrec:  {at: [3, 5], uc: C7.1, action: ttd.record_toggle, label: TTD REC}
    mark:    {at: [3, 6], uc: D3.7, action: ttd.bookmark_add, label: MARK}
    monitor: {at: [3, 8], open: monitor}

# C6: save state. Rows 1 and 2 are the nine quick slots, row 0 the files and the disks.
# +-- screen state: Save state (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      SAVE SZX   SAVE A     SAVE B     SAVE C     SAVE D     A > SCL    SAVE TTD   LOAD TTD
# 1 | S1         S2         S3         S4         S5         S6         S7         S8         S9
# 2 | L1         L2         L3         L4         L5         L6         L7         L8         L9
# 3 | .          .          .          .          .          .          .          .          .
# +--
menu state:
  title: Save state
  label: STATE
  uc: C6
  glyph: snapshot.save
  keys:
    file:    {at: [0, 1], uc: C6.2, action: snapshot.save, value: {path: $user/snapshots/deck.szx}, label: SAVE SZX}
    diska:   {at: [0, 2], uc: C6.3, action: media.save, value: {drive: A}, label: SAVE A}
    diskb:   {at: [0, 3], uc: C6.3, action: media.save, value: {drive: B}, label: SAVE B}
    diskc:   {at: [0, 4], uc: C6.3, action: media.save, value: {drive: C}, label: SAVE C}
    diskd:   {at: [0, 5], uc: C6.3, action: media.save, value: {drive: D}, label: SAVE D}
    scl:     {at: [0, 6], uc: C6.4, action: media.export, value: {drive: A, format: scl}, label: A > SCL}
    tdump:   {at: [0, 7], uc: [C7.1, D12.1], action: ttd.dump, value: {path: $user/sessions/deck.ttd}, label: SAVE TTD}
    tload:   {at: [0, 8], uc: C7.1, action: ttd.load, value: {path: $user/sessions/deck.ttd}, label: LOAD TTD}
    s1:      {at: [1, 0], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 1}, label: S1}
    s2:      {at: [1, 1], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 2}, label: S2}
    s3:      {at: [1, 2], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 3}, label: S3}
    s4:      {at: [1, 3], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 4}, label: S4}
    s5:      {at: [1, 4], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 5}, label: S5}
    s6:      {at: [1, 5], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 6}, label: S6}
    s7:      {at: [1, 6], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 7}, label: S7}
    s8:      {at: [1, 7], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 8}, label: S8}
    s9:      {at: [1, 8], uc: C6.1, action: snapshot.quick, value: {op: save, slot: 9}, label: S9}
    l1:      {at: [2, 0], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 1}, label: L1}
    l2:      {at: [2, 1], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 2}, label: L2}
    l3:      {at: [2, 2], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 3}, label: L3}
    l4:      {at: [2, 3], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 4}, label: L4}
    l5:      {at: [2, 4], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 5}, label: L5}
    l6:      {at: [2, 5], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 6}, label: L6}
    l7:      {at: [2, 6], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 7}, label: L7}
    l8:      {at: [2, 7], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 8}, label: L8}
    l9:      {at: [2, 8], uc: C6.1, action: snapshot.quick, value: {op: load, slot: 9}, label: L9}

# C4, C5: software and the drives. Row 0 recent files and RZX, row 1 the tape, rows 2-3 a column per drive A..D.
# +-- screen media: Media (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      1          2          3          4          5          .          RZX        STOP RZX
# 1 | PLAY       TPAUSE     TSTOP      TREW       TEJECT     .          A-B        NEW A      DISCARD A
# 2 | A          B          C          D          .          SAVE A     SAVE B     SAVE C     SAVE D
# 3 | A          B          C          D          .          TR-DOS     FAST TAPE  TURBO TAP  FAST DISK
# +--
menu media:
  title: Media
  label: MEDIA
  uc: [C4, C5]
  glyph: media.open
  keys:
    r1:      {at: [0, 1], uc: C4.3, action: media.open_recent, value: {index: 0}, label: '1'}
    r2:      {at: [0, 2], uc: C4.3, action: media.open_recent, value: {index: 1}, label: '2'}
    r3:      {at: [0, 3], uc: C4.3, action: media.open_recent, value: {index: 2}, label: '3'}
    r4:      {at: [0, 4], uc: C4.3, action: media.open_recent, value: {index: 3}, label: '4'}
    r5:      {at: [0, 5], uc: C4.3, action: media.open_recent, value: {index: 4}, label: '5'}
    rzxlast: {at: [0, 7], uc: C4.4, action: media.open_recent, value: {index: 0, kind: rzx}, label: RZX}
    rzxstop: {at: [0, 8], uc: C4.4, action: rzx.stop, label: STOP RZX}
    tplay:   {at: [1, 0], uc: C4.2, action: media.tape, value: {op: play}, label: PLAY, show: {readout: media.tape, format: '{block}/{blocks}'}}
    tpause:  {at: [1, 1], uc: C4.2, action: media.tape, value: {op: pause}}
    tstop:   {at: [1, 2], uc: C4.2, action: media.tape, value: {op: stop}}
    trew:    {at: [1, 3], uc: C4.2, action: media.tape, value: {op: rewind}}
    teject:  {at: [1, 4], uc: C4.2, action: media.tape, value: {op: eject}}
    swapab:  {at: [1, 6], uc: C5.2, action: media.swap, value: {drive: A, with: B}, label: A-B}
    blank:   {at: [1, 7], uc: C5.3, action: media.create, value: {drive: A, format: trdos}, label: NEW A}
    discard: {at: [1, 8], uc: C5.5, action: media.discard, value: {drive: A}, label: DISCARD A}
    wpa:     {at: [2, 0], uc: C5.1, action: media.protect, value: {drive: A}, label: A, show: {readout: media.disk.drives.0.protect, format: '{?WP|RW}'}}
    wpb:     {at: [2, 1], uc: C5.1, action: media.protect, value: {drive: B}, label: B, show: {readout: media.disk.drives.1.protect, format: '{?WP|RW}'}}
    wpc:     {at: [2, 2], uc: C5.1, action: media.protect, value: {drive: C}, label: C, show: {readout: media.disk.drives.2.protect, format: '{?WP|RW}'}}
    wpd:     {at: [2, 3], uc: C5.1, action: media.protect, value: {drive: D}, label: D, show: {readout: media.disk.drives.3.protect, format: '{?WP|RW}'}}
    savea:   {at: [2, 5], uc: C6.3, action: media.save, value: {drive: A}, label: SAVE A, show: {readout: media.disk.drives.0.dirty, format: '{?CHANGED|-}'}}
    saveb:   {at: [2, 6], uc: C6.3, action: media.save, value: {drive: B}, label: SAVE B, show: {readout: media.disk.drives.1.dirty, format: '{?CHANGED|-}'}}
    savec:   {at: [2, 7], uc: C6.3, action: media.save, value: {drive: C}, label: SAVE C, show: {readout: media.disk.drives.2.dirty, format: '{?CHANGED|-}'}}
    saved:   {at: [2, 8], uc: C6.3, action: media.save, value: {drive: D}, label: SAVE D, show: {readout: media.disk.drives.3.dirty, format: '{?CHANGED|-}'}}
    eja:     {at: [3, 0], uc: C5.1, action: media.eject, value: {drive: A}, label: A, show: {readout: media.disk.drives.0.name, format: '{}'}}
    ejb:     {at: [3, 1], uc: C5.1, action: media.eject, value: {drive: B}, label: B, show: {readout: media.disk.drives.1.name, format: '{}'}}
    ejc:     {at: [3, 2], uc: C5.1, action: media.eject, value: {drive: C}, label: C, show: {readout: media.disk.drives.2.name, format: '{}'}}
    ejd:     {at: [3, 3], uc: C5.1, action: media.eject, value: {drive: D}, label: D, show: {readout: media.disk.drives.3.name, format: '{}'}}
    trdos:   {at: [3, 5], uc: U4.4, action: set.toggle, value: {name: trdos_traps}, label: TR-DOS}
    ftape:   {at: [3, 6], uc: C2.4, action: set.toggle, value: {name: fast_tape}, label: FAST TAPE}
    ttape:   {at: [3, 7], uc: C2.4, action: set.toggle, value: {name: turbo_tape}, label: TURBO TAPE}
    fdisk:   {at: [3, 8], uc: C2.4, action: set.toggle, value: {name: fast_disk}, label: FAST DISK}

# C3: the machine. A row per family; a press starts the model in place.
# +-- screen machine: Machine (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      PREVIOUS   COLD RST   NOW        .          .          .          TURBO      CP/M
# 1 | 48K        128K       +2         +2A        +3         .          NEXT       SPRINTER   .
# 2 | P128       P512       P1024      SCORP      SC1024     PROF       POLY48     POLY128    POLY P
# 3 | ATM450     ATM710     EVO        TSCONF     VDAC2      PROFI      PROFI512   PROFI3     PROFI+
# +--
menu machine:
  title: Machine
  label: MODEL
  uc: C3
  glyph: mach.start
  keys:
    prev:    {at: [0, 1], uc: C3.3, action: mach.previous, label: PREVIOUS, show: {readout: machine.previous.model, format: '{}'}}
    now:     {at: [0, 3], uc: C3.1, label: NOW, show: {readout: machine.model, format: '{}'}}
    cold:    {at: [0, 2], uc: C1.2, action: mach.cold_reset, label: COLD RST}
    pturbo:  {at: [0, 7], uc: C1.5, action: mach.switch, value: {name: turbo}, label: TURBO}
    pcpm:    {at: [0, 8], uc: C1.5, action: mach.switch, value: {name: cpm}, label: CP/M}
    m48:     {at: [1, 0], uc: C3.1, action: mach.start, value: {model: 48K, replace: true}, label: 48K}
    m128:    {at: [1, 1], uc: C3.1, action: mach.start, value: {model: 128K, replace: true}, label: 128K}
    mplus2:  {at: [1, 2], uc: C3.1, action: mach.start, value: {model: PLUS2, replace: true}, label: '+2'}
    mplus2a: {at: [1, 3], uc: C3.1, action: mach.start, value: {model: PLUS2A, replace: true}, label: '+2A'}
    mplus3:  {at: [1, 4], uc: C3.1, action: mach.start, value: {model: PLUS3, replace: true}, label: '+3'}
    mnext:   {at: [1, 6], uc: C3.1, action: mach.start, value: {model: NEXT, replace: true}, label: NEXT}
    msprint: {at: [1, 7], uc: C3.1, action: mach.start, value: {model: SPRINTER, replace: true}, label: SPRINTER}
    mpent:   {at: [2, 0], uc: C3.1, action: mach.start, value: {model: PENTAGON, ram_kb: 128, replace: true}, label: P128}
    mpent5:  {at: [2, 1], uc: C3.1, action: mach.start, value: {model: PENTAGON, ram_kb: 512, replace: true}, label: P512}
    mpent1:  {at: [2, 2], uc: C3.1, action: mach.start, value: {model: PENTAGON, ram_kb: 1024, replace: true}, label: P1024}
    mscorp:  {at: [2, 3], uc: C3.1, action: mach.start, value: {model: SCORPION, ram_kb: 256, replace: true}, label: SCORP}
    mscorp1: {at: [2, 4], uc: C3.1, action: mach.start, value: {model: SCORPION, ram_kb: 1024, replace: true}, label: SC1024}
    mprofsc: {at: [2, 5], uc: C3.1, action: mach.start, value: {model: PROFSCORP, replace: true}, label: PROF}
    mpoly48: {at: [2, 6], uc: C3.1, action: mach.start, value: {model: ZXPOLY-48K, replace: true}, label: POLY48}
    mpoly:   {at: [2, 7], uc: C3.1, action: mach.start, value: {model: ZXPOLY-128K, replace: true}, label: POLY128}
    mpolyp:  {at: [2, 8], uc: C3.1, action: mach.start, value: {model: ZXPOLY-PENTAGON, replace: true}, label: POLY P}
    matm4:   {at: [3, 0], uc: C3.1, action: mach.start, value: {model: ATM450, replace: true}, label: ATM450}
    matm7:   {at: [3, 1], uc: C3.1, action: mach.start, value: {model: ATM710, replace: true}, label: ATM710}
    mevo:    {at: [3, 2], uc: C3.1, action: mach.start, value: {model: ATM3, replace: true}, label: EVO}
    mtsl:    {at: [3, 3], uc: C3.1, action: mach.start, value: {model: TSL, replace: true}, label: TSCONF}
    mvdac:   {at: [3, 4], uc: C3.1, action: mach.start, value: {model: TSL-VDAC2, replace: true}, label: VDAC2}
    mprofi:  {at: [3, 5], uc: C3.1, action: mach.start, value: {model: PROFI, ram_kb: 1024, replace: true}, label: PROFI}
    mprofi5: {at: [3, 6], uc: C3.1, action: mach.start, value: {model: PROFI, ram_kb: 512, replace: true}, label: PROFI512}
    mprofi3: {at: [3, 7], uc: C3.1, action: mach.start, value: {model: PROFI3, replace: true}, label: PROFI3}
    mprofip: {at: [3, 8], uc: C3.1, action: mach.start, value: {model: PROFI-PLUS, replace: true}, label: PROFI+}

# C8: sound. A column per source: mute above, solo below; the dials set the volumes of the first six.
# +-- screen sound: Sound (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      SOUMUTE    >AY CHANS  .          STEREO     FIR        PUNCH      DC         .
# 1 | BEEP       AY1        AY2        AY3        FM1        COVOX      GS         MS FM      MS PCM
# 2 | BEEP       AY1        AY2        AY3        FM1        COVOX      GS         MS FM      MS PCM
# 3 | N AY1      N AY2      N AY3      N DAC      FM2        GS MP3     MIDI       CD         SAA
# opens: [0,2] ay
# dial 0 BEEPER: turn audio.volume_by, press audio.source_mute
# dial 1 AY1: turn audio.volume_by, press audio.source_mute
# dial 2 AY2: turn audio.volume_by, press audio.source_mute
# dial 3 COVOX: turn audio.volume_by, press audio.source_mute
# dial 4 GS: turn audio.volume_by, press audio.source_mute
# dial 5 MASTER: turn audio.volume_by, press audio.mute_toggle
# +--
menu sound:
  title: Sound
  label: SOUND
  uc: C8
  glyph: audio.sound
  dials:
    0: {label: BEEPER, uc: C8.2, turn: {action: audio.volume_by, value: {d: $ticks, source: beeper}}, press: {action: audio.source_mute, value: {source: beeper}}}
    1: {label: AY1, uc: C8.2, turn: {action: audio.volume_by, value: {d: $ticks, source: ay1}}, press: {action: audio.source_mute, value: {source: ay1}}}
    2: {label: AY2, uc: C8.2, turn: {action: audio.volume_by, value: {d: $ticks, source: ay2}}, press: {action: audio.source_mute, value: {source: ay2}}}
    3: {label: COVOX, uc: C8.2, turn: {action: audio.volume_by, value: {d: $ticks, source: covox}}, press: {action: audio.source_mute, value: {source: covox}}}
    4: {label: GS, uc: C8.2, turn: {action: audio.volume_by, value: {d: $ticks, source: gs}}, press: {action: audio.source_mute, value: {source: gs}}}
    5: {label: MASTER, uc: C8.2, turn: {action: audio.volume_by, value: {d: $ticks}}, press: {action: audio.mute_toggle}}
  keys:
    soumute: {at: [0, 1], uc: C8.1, action: audio.mute_toggle}
    ay:      {at: [0, 2], open: ay}
    stereo:  {at: [0, 4], uc: C8.4, action: set.value, value: {name: ay_stereo, value: next}, label: STEREO}
    fir:     {at: [0, 5], uc: C8.4, action: set.toggle, value: {name: fir_filter}, label: FIR}
    aypunch: {at: [0, 6], uc: C8.4, action: set.toggle, value: {name: ay_punch}, label: PUNCH}
    dc:      {at: [0, 7], uc: C8.4, action: set.toggle, value: {name: covox_dc_removal}, label: DC}
    mbeep:   {at: [1, 0], uc: C8.2, action: audio.source_mute, value: {source: beeper}, label: BEEP}
    may1:    {at: [1, 1], uc: C8.2, action: audio.source_mute, value: {source: ay1}, label: AY1}
    may2:    {at: [1, 2], uc: C8.2, action: audio.source_mute, value: {source: ay2}, label: AY2}
