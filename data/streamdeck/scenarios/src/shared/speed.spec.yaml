# Shared menu: speed (C2). Every scenario that opens it ('open: speed') includes shared/speed.deck.yaml.
shared: speed
model: plusxl

menu speed:
  title: Speed
  uc: C2
  glyph: set.speed
  keys:
    x1:     {at: [0, 1], uc: C2.5, action: set.speed, value: 1, label: X1}
    x2:     {at: [0, 2], uc: C2.1, action: set.speed, value: 2, label: X2}
    x4:     {at: [0, 3], uc: C2.1, action: set.speed, value: 4, label: X4}
    x8:     {at: [0, 4], uc: C2.1, action: set.speed, value: 8, label: X8}
    x16:    {at: [0, 5], uc: C2.1, action: set.speed, value: 16, label: X16}
    next:   {at: [0, 6], uc: C2.1, action: set.speed, title: Next speed, label: NEXT}
    turbo:  {at: [1, 1], uc: C2.2, action: mach.turbo_toggle}
    audio:  {at: [1, 2], uc: C2.3, action: set.toggle, value: {name: turbo_audio}, label: SOUND}
    tape:   {at: [1, 3], uc: C2.4, action: set.toggle, value: {name: fast_tape}, label: TAPE}
    disk:   {at: [1, 4], uc: C2.4, action: set.toggle, value: {name: fast_disk}, label: DISK}
