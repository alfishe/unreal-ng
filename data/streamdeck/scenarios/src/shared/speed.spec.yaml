# Shared menu: speed (C2). Every scenario that opens it ('open: speed') includes shared/speed.deck.yaml.
shared: speed
model: plusxl

# +-- screen speed: Speed (deckflow build writes this map from the keys below)
#     0          1          2          3          4          5          6          7          8
# 0 | <BACK      X1         X2         X4         X8         X16        NEXT       .          .
# 1 | .          TURBO      TURBO SND  FAST TAPE  FAST DISK  .          .          .          .
# 2 | .          .          .          .          .          .          .          .          .
# 3 | .          .          .          .          .          .          .          .          .
# +--
menu speed:
  title: Speed
  label: SPEED
  uc: C2
  glyph: set.speed
  keys:
    x1:     {at: [0, 1], uc: C2.5, action: set.speed, value: {value: 1}, label: X1}
    x2:     {at: [0, 2], uc: C2.1, action: set.speed, value: {value: 2}, label: X2}
    x4:     {at: [0, 3], uc: C2.1, action: set.speed, value: {value: 4}, label: X4}
    x8:     {at: [0, 4], uc: C2.1, action: set.speed, value: {value: 8}, label: X8}
    x16:    {at: [0, 5], uc: C2.1, action: set.speed, value: {value: 16}, label: X16}
    next:   {at: [0, 6], uc: C2.1, action: set.speed, title: Next speed, label: NEXT}
    turbo:  {at: [1, 1], uc: C2.2, action: mach.turbo_toggle, label: TURBO}
    audio:  {at: [1, 2], uc: C2.3, action: set.toggle, value: {name: turbo_audio}, label: TURBO SND}
    tape:   {at: [1, 3], uc: C2.4, action: set.toggle, value: {name: fast_tape}, label: FAST TAPE}
    disk:   {at: [1, 4], uc: C2.4, action: set.toggle, value: {name: fast_disk}, label: FAST DISK}
