format: streamdeck-scenario
model: plusxl
name: unreal
root:
  context: play
  dials:
    -
      index: 0
      label: TIME
      press:
        id: run.pause_toggle
        kind: action
      turn:
        id: ttd.seek_by
        kind: action
        value:
          d: $ticks
          max: 50
          min: 1
          rate: $rate
          unit: seconds
    -
      index: 1
      label: VOLUME
      press:
        id: audio.mute_toggle
        kind: action
      turn:
        id: audio.volume_by
        kind: action
        value:
          d: $ticks
    -
      index: 2
      label: PACE
      press:
        id: run.pace_toggle
        kind: action
      turn:
        id: run.pace_by
        kind: action
        value:
          d: $ticks
    -
      index: 3
      label: STEP
      press:
        id: run.step_in
        kind: action
      turn:
        id: run.step_by
        kind: action
        value:
          d: $ticks
          unit: instructions
    -
      index: 4
      label: FRAMES
      press:
        id: ttd.bookmark_add
        kind: action
      turn:
        id: ttd.jog_frames
        kind: action
        value:
          d: $ticks
    -
      index: 5
      label: OPS
      press:
        id: ttd.resume_live
        kind: action
      turn:
        id: ttd.jog_instructions
        kind: action
        value:
          d: $ticks
  face:
    glyph: nav.folder
  id: home
  items:
    -
      at:
        - 0
        - 0
      do:
        id: run.pause_toggle
        kind: action
      face:
        glyph: run.pause
      face_on:
        glyph: run.play
      id: pause
      state: run.state.paused
      tags:
        - uc:C1.1
      title: "Pause / continue"
      type: action
    -
      at:
        - 0
        - 1
      do:
        hold: true
        id: mach.reset
        kind: action
      face:
        glyph: mach.reset
      id: reset
      tags:
        - uc:C1.2
      title: "Reset (hold 1 s)"
      type: action
    -
      at:
        - 0
        - 2
      do:
        id: mach.nmi
        kind: action
      face:
        glyph: mach.nmi
      id: nmi
      tags:
        - uc:C1.3
      title: NMI
      type: action
    -
      at:
        - 0
        - 3
      do:
        id: mach.turbo_toggle
        kind: action
      face:
        glyph: mach.turbo
      face_on:
        glyph: mach.turbo.on
      id: turbo
      state: toggle.mach.turbo_toggle
      tags:
        - uc:C2.2
      title: Turbo
      type: action
    -
      at:
        - 0
        - 4
      do:
        hold: true
        id: run.turbo_hold
        kind: action
      face:
        glyph: run.turbo_hold
      id: hold
      tags:
        - uc:C2.2
      title: "Turbo while held"
      type: action
    -
      at:
        - 0
        - 5
      do:
        id: set.speed
        kind: action
        value: 1
      face:
        glyph: set.speed
        label: SPEED
        value:
          format: "X{}"
          readout: run.state.speed
      id: x1
      tags:
        - uc:C2.5
      title: Speed
      type: action
    -
      at:
        - 0
        - 6
      file: shared/speed.deck.yaml
      id: speed
      tags:
        - open:speed
      type: include
    -
