# The Steam Deck's own controller (hidraw): pad-default for what every pad has, and what only the Deck has. The left
# trackpad is a second D-pad and fire, the right one the mouse (a laptop pad: the finger's travel moves the pointer,
# `scale` counts per pad unit - the pad spans 2 - with `accel`, the pointer acceleration; [INPUT] MouseScale applies on
# top, as to the host mouse), its click the left button. L2 is the right button, as in Steam's desktop layout; while
# the program reads a mouse, the fire buttons (A, R2) are its left button (InputRouter::SetMouseButtons). The back grips: R4 (paddle.p1) the second fire, R5 (paddle.p2) the auto fire,
# L4 (paddle.p3) SPACE; L5 (paddle.p4) stays free for the debug layer key (debug/steam-deck.yaml)
schema: 1
kind: play
id: builtin/play/steam-deck
label: Steam Deck
applies_to: { families: [steam-deck] }
layers:
  play:
    ltouchpad:        { retro: "auto:dpad" }
    ltouchpad.click:  { retro: "auto:fire" }
    rtouchpad.x:      { mouse: dx, scale: 92 }
    rtouchpad.y:      { mouse: dy, scale: 92 }
    rtouchpad.click:  { mouse: left }
    lt.click:         { mouse: right, label: Mouse right }
    paddle.p1:        { retro: "auto:fire2" }
    paddle.p2:        { retro: "auto:fire", turbo: classic, on: 2, off: 2, label: Fire (auto) }
    paddle.p3:        { key: SPACE }
