# The global default of every game pad (mapping-and-profiles.md §8). Control names are positional: `south` is A on
# Xbox, Cross on PlayStation, B on Switch, so one profile serves every pad family
schema: 1
kind: play
id: builtin/play/pad-default
label: Game pad
layers:
  play:
    "dpad.*":   { retro: "auto:dpad" }
    lstick:     { retro: "auto:dpad" }
    south:      { retro: "auto:fire" }
    east:       { retro: "auto:fire2" }
    west:       { retro: "auto:fire3" }
    north:      { key: SPACE }
    menu:       { key: ENTER }
    view:       { action: osd.keyboard }
    rt.click:   { retro: "auto:fire", turbo: classic, on: 2, off: 2, label: Fire (auto) }
    rstick.x:   { mouse: dx }
    rstick.y:   { mouse: dy }
