# Exolon (Hewson 1987) on a Pentagon with TR-DOS. Q A O P move; hold fire for a grenade. Three documents: the releases
# that fire with Space, the releases that fire with M (most of them), and the demo, whose code sits elsewhere.
# Haptics (haptics.md §13 H5), checked by play on a Pentagon (7FFD = #10, page 0 at #C000) in every listed release:
# #8366 fires the blaster, #9221 launches a grenade, #92D4 detonates it, #9CB9 kills Vitorc. Checked by play on the
# bugfix release EXLNSlTb, at the same bytes in the others: #99CE takes grenades, #9978 takes ammo, the sound #C155
# destroys an enemy (it also plays when an enemy runs into Vitorc), the sound #C0E7 is a bullet hitting a solid object.
# The beeper option keeps every address (only the sound routine differs). The builds before the 2024 bugfix kill
# Vitorc again and again near a zone's start (the bug the fix at #9D06 clamps), so they give more `died` events.
# Matching by content signature (`match.signatures`, from swsignature) replaces the hash lists once the library exists.
#
# Space fires: EXOLON.SCL (EXLNSlTb, Slider'21 / tiboh'24 bugfix), EXOL_CAP (Style Group), EXOLO (Mike Blum trainer).
schema: 1
kind: play
id: builtin/game/exolon
label: Exolon
extends: [scheme/qaop-space]
match:
  machines: [PENTAGON]
  file_sha256:
    - "598021f0f0f850f0ad6c214369be8eb65a71ff3e878c60ed716066add15cb35a"
    - "368774dff15bfaa8e10dd20dcdd48ab21e150567da1701c0103c1a3fa2baf7c1"
    - "7685cccca17661658b7df61ad42425db3c06fd7b692216b7b266354c6767d9fd"
layers:
  play:
    south:        { key: SPACE, label: Fire }
    north:        { key: Q, label: Jump }
    menu:         { key: "1", label: Start }
haptics:
  sources:
    shot:     { probe: exec, address: "0x8366" }
    grenade:  { probe: exec, address: "0x9221" }
    blast:    { probe: exec, address: "0x92D4" }
    died:     { probe: exec, address: "0x9CB9" }
    grenades: { probe: exec, address: "0x99CE" }
    ammo:     { probe: exec, address: "0x9978" }
    kill:     { probe: exec, address: "0xC155" }
    ricochet: { probe: exec, address: "0xC0E7" }
  rules:
    - { on: shot, play: shot, target: "trigger.right|handle.high" }
    - { on: grenade, play: knock }
    - { on: blast, play: explosion }
    - { on: died, play: life-lost }
    - { on: grenades, play: pickup }
    - { on: ammo, play: pickup }
    - { on: kill, play: hit }
    - { on: ricochet, play: tick, target: handle.high }
---
