# Chase H.Q. (Ocean 1989), part 1, on a Pentagon with TR-DOS (the Flash Star release boots on a Profi only). Three
# documents: the releases on the bugfix's addresses, the General Sound version, and the Sinclair User demo, whose code
# sits elsewhere. With 4 (Keyboard) in the menu: O left, P right, Q accelerates, A brakes, Space changes gear, T turbo
# (some builds bind other keys; option 5 redefines them). Haptics (haptics.md §13 H5), checked by play in every listed
# release: the speed is the word at #A24A (0 to 511 with turbo), #A4B1 is a crash into the roadside, #A78A a hit on the
# criminal's car, #889C a turbo start. Checked by play on CHHQ+2_T, at the same bytes in the others: #B076 requests
# the landing after a hill crest (effect id 2), #A437 the scrape along a tunnel wall (id 6).
# Matching by content signature (`match.signatures`, from swsignature) replaces the hash lists once the library exists.
#
# The releases (the SHA-256 of each image, in this order): CHHQ+2_T (tiboh's bugfix, +2 trainer), CHHQ_TMA
# (Torgunakov 1994), CHHQLAKS (LAKS), CHSHQAVF (AVF), CHHQR_ES (Russian "Pogonya!", E. Sardak), CHASE_1 (Maxsoft),
# CHASHQAP (Popushin), CHASHQHS (Hackersoft'25), CHASE_HQ (Power of Sound'97, +5 levels), CHASEVAD (VAD), CHHQAKHZ
# (Kurenin), C_HQ_KSA (KSA Software, 128K), CHASE1GD (Golden Eagle & Mad Max, 128K, intro menu 1), CHHQ_SCI (ASW /
# Fantastic Soft 1995), CHASHQMK (the 48K beeper build, Mazanov & Kverznev 1992), CHHQ_FSS (Flash Star, Profi only).
schema: 1
