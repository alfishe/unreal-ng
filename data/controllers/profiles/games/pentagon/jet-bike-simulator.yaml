# Jet Bike Simulator (Mastertronic 1988), the 48K TZX "JetBikeSimulator(48K).tzx" (a 48K game: the 128K loader resets on it, so
# take 48 BASIC (down x3, ENTER), then LOAD "" (J, SYM+P twice, ENTER); the load ends on the options menu: SPACE moves the
# arrow, ENTER takes it, "START 1 PLAYER" is the first line). Keys from the game's own INSTRUCTIONS page and its key reader
# (#6CCD tests one key by index; #8000..#8053 sets the three input flags of every human bike): player 1 A left, S right, D thrust;
# player 2 N, M, ENTER; P pauses, Q quits to the menu (never map Q). The race is a 36 s qualifying clock over one screen: steer
# between the numbered buoys 1 to 5 in order, a lap time appears in the HUD when a bike finishes one. Haptics (haptics.md §13 H5),
# found with TTD on a recorded run (the first bike record is at #87FB, IX of the key reader, found by seeking to the exact
# instruction of #804F and reading IX): the speed is the byte #880D (0 to about 76: it grows 1 per frame while D is held and
# decays when it is released); #82F2 is the bounce routine (it reverses the velocity, sets the collision flag (ix+#26) = #8821 and takes 50 off the energy
# byte #880E), run when a bike hits the shore or a buoy: the speed fell 54 to 32 in the same frames. The routine is shared with
# the computer bikes (15 runs in 25 s with no key pressed), so the probe watches the player's flag #8821 going 0 to 1 instead of
# the routine. Checked in real time (menu, then 20 s with no key, then D held with A / S alternating 3 s each):
# 1 `hit` with no key (the start), 7 `hit` with the keys, speed value 76 at the top (level 1.0). The buoy and lap counters sit in the same
# bike record (#83C0: ix+#24 counts the buoys passed, 1 to 5; #83CA..#83D2: at 5 it resets to 0 and ix+#25 counts the laps; the three computer
# bikes at the record stride #2B showed 5 buoys and one lap each every 25 s), so for the player #881F going up is a buoy and #8820 going up a lap (the first lap step is the start line crossing at the race start;
# checked in real time: 2 buoys, 1 lap, 51 hits in 33 s of random A / S).
schema: 1
kind: play
id: builtin/game/jet-bike-simulator
label: Jet Bike Simulator
match:
  machines: [PENTAGON, 128K, 48K]
  file_sha256: ["52e7b32587e077ac1681cee2c8766636cad44bdc84da6c06db8e8ad6ab4747bb"]
layers:
  play:
    "dpad.*":     { none: true }
    lstick:       { none: true }
    dpad.left:    { key: A }
    dpad.right:   { key: S }
    lstick.left:  { key: A }
    lstick.right: { key: S }
    rt.click:     { key: D, label: Thrust }
    south:        { key: SPACE, label: Select }
    menu:         { key: ENTER, label: Start }
haptics:
  sources:
    speed: { probe: value, address: "0x880D", scale: 3.4 }
    hit:   { probe: write, address: "0x8821", when: increased }
    buoy:  { probe: write, address: "0x881F", when: increased }
    lap:   { probe: write, address: "0x8820", when: increased }
  rules:
    - { on: speed, play: engine, target: handle.low }
    - { on: hit, play: thump }
    - { on: buoy, play: tick }
    - { on: lap, play: pickup }
