# Super Hang-On, part 3 (Senior) of the Electric Dreams ZX release (Sega 1987), the archive.org Z80 snapshot
# "Super_Hang_On_Part_3_Senior_1986_Electric_Dreams_Software.z80" (it starts on the "Today's best racers" screen; in the options
# screen 1 takes the keyboard and SPACE (fire) starts the race). Keyboard (checked by holding each key and watching the bike and the speed
# readout): Q accelerates, A brakes, O steers left, P steers right; A also toggles "attribute inks" in the options screen.
# The four parts are separate builds, so the addresses differ per part (this profile is for part 3 only). Haptics
# (haptics.md §13 H5), found with TTD on a recorded run of part 1 and carried over to the other parts by the code shape: the
# speed is the byte #B5C1 (the HUD shows ten times it: 9 at the 90 km cruise, about 23 at full throttle, 0 after a crash),
# #B3BA is the head of the stop routine (xor a; ld (speed),a ...), run once per crash (the bike falls and the wreck lies on the road;
# it also runs when the time is out: GAME OVER stops the bike the same way). Checked in real time on all four parts (Q held 5 s,
# then O / P held until it fires): speed value 23 at full throttle (level 0.99), 9 at the cruise, 1 `crash` per run.
# The off-road drag is the "dec a; ld (accel),a" step of the speed update (beginner #B561; it runs only while the bike's lateral
# position |#A71A| is large, 0 runs on the road, 16 in 3 s on the sand, and the speed falls 25 -> 10 meanwhile), found in the other parts by
# the byte shape FE 50 38 07 3A xx xx 3D 32 xx xx. A crash cannot be told from the time-out by the probe; an overtake is not an event of the game (only the contact is): `rival` is the entry of the rider-contact routine ("ld a,(lateral); neg" after the overlap test, found in the other parts by the byte shape ED 44 32 xx xx 3A xx xx FE 0C 38 xx 5F 87 83 1F), run once per touch, it cuts the speed by a quarter; no checkpoint event yet.
schema: 1
kind: play
id: builtin/game/super-hang-on-senior
label: Super Hang-On (Senior)
match:
  machines: [PENTAGON, 128K, 48K]
  file_sha256: ["a610813a8f3408afbe540f5344020b40847366a65adf2e961e40407bb262cda5"]
layers:
  play:
    "dpad.*":     { none: true }
    lstick:       { none: true }
    dpad.left:    { key: O }
    dpad.right:   { key: P }
    lstick.left:  { key: O }
    lstick.right: { key: P }
    rt.click:     { key: Q, label: Accelerate }
    lt.click:     { key: A, label: Brake }
    south:        { key: SPACE, label: Start }
    east:         { key: "1", label: Keyboard }
haptics:
  sources:
    speed: { probe: value, address: "0xB5C1", scale: 11 }
    crash: { probe: exec, address: "0xB3BA" }
    rival:   { probe: exec, address: "0xBE0F" }
    offroad: { probe: exec, address: "0xB456" }
  rules:
    - { on: speed, play: engine, target: handle.low }
    - { on: crash, play: explosion, scale: 0.9 }
    - { on: offroad, play: rumble-strip }
    - { on: rival, play: hit, scale: 0.7 }
