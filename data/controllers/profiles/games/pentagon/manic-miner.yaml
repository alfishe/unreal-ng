# Manic Miner (Bug-Byte 1983) on a Pentagon with TR-DOS. Two documents: the releases on the original addresses, and
# Phantom Ltd's release, whose code sits 6 to 11 bytes higher. O left, P right, Space jumps. Haptics (haptics.md §13
# H5), checked by play on a Pentagon: #8906 is the death of a real game (not the demo), #8F82 takes an item, #8C7B
# starts a jump (these three in every listed release), #89AA is the game over, #90D9 counts the air into the score at a
# cavern's end, #91B5 drops Kong, #907D is the ending after the last cavern (these four in MMIN_EST).
#
# The first document's releases (the SHA-256 of each .SCL, in this order): MMIN_EST (eYe-Q'99), MMINERWC (AmoNik'00),
# MANICMDG (D. Gultyaev'94, menu 2), MANICMKK (K. Kalantaj'01), MANM_THH (The Hot Heads'99), MNC+2SMK (Smokers'97,
# Manic Miner 1 and 2), MMINE2WC (Manic Miner 2, Welcome Corp., infinite lives), M_MINER3 (Korund), MMINR3DL
# (D-Love'00), M_MINER4 (Korund), MM4SE_TM (Triumph'04), MNMINER5 (V. Drozd), M_MINER6 (Korund), MMBUDDTM, MMMAJOTM,
# MMHOB_TM (Triumph'04), MM_HOBBE, MM_HOBBH (Korund), MM3DDEMO (the "3D demo" April fool cavern). The mods keep the
# Bug-Byte engine and change caverns, tunes and texts only. Matching by content signature (`match.signatures`, from
# swsignature) replaces the hash lists once the library exists.
