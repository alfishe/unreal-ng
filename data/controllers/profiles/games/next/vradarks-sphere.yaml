schema: 1
kind: play
id: builtin/game/vradarks-sphere
label: Vradarks Sphere 1.2
extends: [scheme/qaop-space]
# Vradarks Sphere 1.2 (TAP, sha256 e1d7b708...). It is a 128K tape game with a custom headerless loader; it was
# loaded and played on a Pentagon 128K only (machines below). It was not run on the Next: the tape is a 128K
# Spectrum title, the Pentagon was enough, and no Next-only feature is needed.
# Turn-based roguelike: one tile per key tap (Q up, A down, O left, P right, the cursor keys the same), SPACE
# selects in the menu and dismisses a hint, ENTER shows the info page, E / H quit to the menu.
#
# Haptics from game events only, found with per-frame coverage diffs over idle / walk / fight frames and proven in
# real time with exec probes (game.events fires), about 400 random-walk taps in one run:
#   hurt   0x9B05  a creature hit the hero (fires together with the write of the hero HP byte, once per hit)
#   killed 0x9B51  a creature dies (fires for the hero's own last hit points too; once per death)
#   pickup 0xA2C9  any pickup: a coin, a life potion (HP 8 -> 10); the coin routine 0xA210 fires with it
# The code is in the fixed 0x8000 bank, so no page qualifier is needed.
# Left out: 0x9B22 (every attack, fires together with hurt), 0x9AB6 / 0x9DF8 (every bump or attack, per key tap),
# 0xA210 (coin only, covered by pickup), a write probe on the hero HP at page 0 0xE403 (the 0xC000 bank flips).
# Effects follow the sibling Vradark's Revenge, where the owner tuned them by feel: a death is a `thump`, a pickup is
# `pickup` at 1.7x so a coin is felt.
# Known limits: a distinct "hero died" address was not isolated (the death shows as hurt + killed); a spell or
# a boss were not reached; the explicit death effect is not played.
match:
  machines: [PENTAGON]
  file_sha256: ["e1d7b708f754b9965661d26667476a372d81c6817a38c6bb32eee159554f0d7e"]
layers:
  play:
    south:        { key: SPACE, label: Select / dismiss hint }
    west:         { key: ENTER, label: Info }
events:
  hurt:   { probe: exec, address: "0x9B05" }
  killed: { probe: exec, address: "0x9B51" }
  pickup: { probe: exec, address: "0xA2C9" }
haptics:
  rules:
    - { on: hurt, play: hit }
    - { on: killed, play: thump }
    - { on: pickup, play: pickup, scale: 1.7 }
---
# Vradark's Sphere 1.2, the Next release (Vradark.snx, sha256 e6451f21...: a 128K snapshot whose music and graphics come
# from the SD card's res/ and music/ folders, so start it from NextZXOS's Browser). The same game as the TAP above but
# another build: none of the TAP's addresses is in this code. The events here are data, not code: the game keeps the
# hero's numbers in RAM and the HUD reads them.
# Found by tapping to a coin, a skeleton and a bug with memory snapshots around each HUD change (the screen text names
# the event: "The coin's been found!", "Hero attacked Skeleton and killed him!", "Bug attacked Hero, hit 1, Left 7 HP"):
#   hurt   #6C03       the hero's hit points (page 5): 8 -> 7 at a bug's bite
#   killed #C011       the kill counter shown as the second line of the panel (n/50), page 0 in the #C000 window: +1 per
#                      kill (a skeleton, a bug; 2 -> 3 -> 4 -> 5 in one run)
#   pickup #C014       the gold shown at the bottom of the panel: +1 per coin (2 -> 3)
#   died   #6C03 == 0  the hit points reach 0
# Checked by play on a NEXT (real time, game.events monitor, a 170 s random walk): 8 `killed` and 14 `hurt` while the
# panel's text named a kill or a bite each time, the death (game over, back to the title) fired `died`. Known limit: the
# title and intro screens reuse the memory of #6C03, so they fire `hurt` / `died` too (about a dozen when the game is
# loaded, a few more on the way back to the title after a death). Not run to the end: coins were checked by the gold byte
# going 2 -> 3, not by the monitor.
# Turn-based, so every event is one key tap; the controls are the TAP's (Q A O P, SPACE, ENTER).
schema: 1
kind: play
id: builtin/game/vradarks-sphere-next
label: Vradarks Sphere 1.2 (Next)
extends: [scheme/qaop-space]
match:
  machines: [NEXT]
  file_sha256: ["e6451f213f240f975f381428701e882b2bb8be828fe05bdbb11bc1d6beacfd76"]
layers:
  play:
    south:        { key: SPACE, label: Select / dismiss hint }
    west:         { key: ENTER, label: Info }
events:
  hurt:   { probe: write, address: "0x6C03", when: decreased }
  died:   { probe: write, address: "0x6C03", when: "==", value: 0 }
  killed: { probe: write, address: "page:0:0xC011", when: increased }
  pickup: { probe: write, address: "page:0:0xC014", when: increased }
haptics:
  rules:
    - { on: hurt, play: hit }
    - { on: died, play: life-lost }
    - { on: killed, play: thump }
    - { on: pickup, play: pickup, scale: 1.7 }
