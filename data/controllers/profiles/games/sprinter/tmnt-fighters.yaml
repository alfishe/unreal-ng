# Teenage Mutant Ninja Turtles Fighters 1.2 (ZX Online, 2025), the Sprinter build `TMNTF\tmntf.exe` (a DSS program; the same
# download holds a TS-Conf build). Started from the hard disk, so no file is loaded by the emulator: apply this profile by hand
# (`controllers apply`) or let the program's hash choose it where the host knows it. Menu: Player vs Computer, difficulty, fighter,
# arena, then the fight (ENTER confirms each page). Keys (the game's own "Redefine keys" page, player 1): W / S / A / D move, V low
# punch, G high punch, B low kick, H high kick, J block. Haptics (haptics.md §13 H5), found with TTD on a recorded fight (the health
# bars measured on the screen against RAM, all 64 KB of the CPU space every 30-40 frames): a fighter's health is one byte, 135 at the
# full bar (a bar pixel is half a unit), player 1 at #2F67, player 2 at #2FD0 (the records are #69 apart; #2F68 trails #2F67 by a
# frame and #2F69 holds the damage taken so far), refilled to 135 at each round. A write that lowers it is a hit taken.
# Checked in real time (the program started from a copy of the MAME-pack system disk with \TMNTF added, profile applied by hand;
# 70 s of walking right and random blows against the computer on Normal): 35 `hurt`, 63 `strike`, 1 `down` and 1 `won`, the health
# bars on the screen followed the two bytes. The gamepad keys of the layer use the host key overlay as the other profiles do and
# were not tried with a physical pad (the check typed the keys through the WebAPI).
# Known limits: block and throw are not told apart (a blocked blow still takes the chip damage), the round and match results are
# the two health bytes reaching 0, the special meter (#AA24 fell 71 -> 0 in a fight, not identified) is not used.
schema: 1
kind: play
id: builtin/game/tmnt-fighters
label: Teenage Mutant Ninja Turtles Fighters (Sprinter)
match:
  machines: [SPRINTER]
  file_sha256: ["1956c19dcf61a1017603b6b296226ecd45b35b8b9963ade2780282468f768148"]
layers:
  play:
    "dpad.*":     { none: true }
    lstick:       { none: true }
    dpad.up:      { key: W }
    dpad.down:    { key: S }
    dpad.left:    { key: A }
    dpad.right:   { key: D }
    lstick.up:    { key: W }
    lstick.down:  { key: S }
    lstick.left:  { key: A }
    lstick.right: { key: D }
    west:         { key: V, label: Low punch }
    north:        { key: G, label: High punch }
    south:        { key: B, label: Low kick }
    east:         { key: H, label: High kick }
    lb:           { key: J, label: Block }
    rb:           { key: J, label: Block }
    menu:         { key: ENTER, label: Start }
haptics:
  sources:
    hurt:   { probe: write, address: "0x2F67", when: decreased }
    strike: { probe: write, address: "0x2FD0", when: decreased }
    down:   { probe: write, address: "0x2F67", when: "==", value: 0 }
    won:    { probe: write, address: "0x2FD0", when: "==", value: 0 }
  rules:
    - { on: hurt, play: hit }
    - { on: strike, play: tick, target: handle.low }
    - { on: down, play: explosion, scale: 0.9 }
    - { on: won, play: thump, scale: 0.6 }
