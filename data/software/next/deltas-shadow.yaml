# Delta's Shadow v1.61, ZX Spectrum Next release (DS 05.02.21 spectrum_next.snx, a 128K snapshot that reads Data/*.bin from
# the SD card: start it from NextZXOS's Browser in the game's folder). Controls (README_ENG, checked in play): W A S D
# move, B throws the blade (attack), N jumps, M opens the suit / inventory screen, P pauses; an 8-button Kempston pad is
# also read by the game. In the menus B selects.
# Haptics (haptics.md §13 H5). The engine is one sprite loop; the hero's start routines were found by per-frame coverage
# (idle baseline of 120 frames, then three presses of each key, addresses that ran in exactly one or two frames at the
# same frame of every press): #EB95 is the first instruction after the jump's checks (frame 0 of the press only), #EF9F the
# blade throw (frame 0 only). Both live in RAM bank 3 (#C000 window, #E000 half), so they are page qualified.
# Checked by play on a NEXT (card + NextZXOS + Browser, real time): N x1 / x3 taps = 1 / 3 `jump`, holding N 1.5 s = 1,
# D + N = 1; B x1 / x3 = 1 / 3 `attack`, holding B 1.5 s = 1; A, S, W taps, walking and 5 s idle = nothing.
# Found in a TTD recording of real play (the owner ran the first level, hit enemies and died once): the hero's health
# is the byte #7F59 (77 at the start, minus 16 per hit, 0 = dead; #7F5A is the HUD copy that follows it), written only
# when it changes, so a write probe `decreased` is a hit and `== 0` the death. #7F44 is the hero's air flag: #FF from the
# jump to the landing (about 30 frames), written 0 every frame on the ground, so only the fall to 0 (`decreased`) is a
# landing. Left out: #B789 (the shared "set animation" routine, runs for every object on every change, 2 to 3 times
# per walking step). The slide under a low pipe is the right trigger: the game reads it from the 8-button Kempston pad
# (the default turbo fire of that trigger is dropped here, a slide is one press). Not tried: the 128K TRD releases
# and the cspect_emul .snx (another loader, 49179 bytes); pickups.
schema: 1
kind: play
id: builtin/game/deltas-shadow
label: Delta's Shadow
extends: [scheme/wasd]
match:
  machines: [NEXT]
  file_sha256: ["bda27a1ff43c809fc54a4899b848423fe80b7bb48cf4c0eb000de95404780964"]
layers:
  play:
    south:        { key: N, label: Jump }
    west:         { key: B, label: Attack }
    north:        { key: M, label: Suit }
    menu:         { key: P, label: Pause }
    rt.click:     { retro: "auto:fire", label: Slide }
events:
  jump:   { probe: exec, address: "page:3:0xEB95" }
  attack: { probe: exec, address: "page:3:0xEF9F" }
  land:   { probe: write, address: "0x7F44", when: decreased }
  hurt:   { probe: write, address: "0x7F59", when: decreased }
  died:   { probe: write, address: "0x7F59", when: "==", value: 0 }
haptics:
  rules:
    - { on: jump, play: tick, target: handle.high }
    - { on: attack, play: shot, target: handle.high }
    - { on: land, play: knock, target: handle.low }
    - { on: hurt, play: hit }
    - { on: died, play: life-lost }
