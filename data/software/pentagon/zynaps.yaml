    - {name: Player2SideWeapon, at: "0x7FD4"}
    - {name: Player2DoublePlasma, at: "0x7FD5"}
    - {name: Player2LaserLevel, at: "0x7FD6"}
    - {name: Player2Speed, at: "0x7FD7"}
    - {name: Player2ExtraLives, at: "0x7FD8"}
    - {name: Player2LevelState, at: "0x7FD9"}
