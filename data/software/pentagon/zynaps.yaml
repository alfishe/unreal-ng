    - {name: ExplosionAnim, at: "0x7EA1", comment: "The explosion's sprite and animation record"}
    - {name: SightDescriptor, at: "0x7EAE", comment: "The sight's sprite descriptor (record $F600, kind 6)"}
    - {name: PodAnim, at: "0x7EBB", comment: "The weapon pod's sprite and animation record"}
    - {name: LaserDescriptor, at: "0x7EC8", comment: "The laser shot's sprite descriptor (the four records from $F4F8)"}
    - {name: ShotDescriptor, at: "0x7ED5", comment: "The enemy shot's and the plasma ball's sprite descriptor"}
