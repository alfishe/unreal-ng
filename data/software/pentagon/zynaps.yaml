    - {name: SpriteCacheRecord3, at: "0x7F12"}
    - {name: SpriteCacheRecord4, at: "0x7F22"}
    - {name: SpriteCacheRecord5, at: "0x7F32"}
    - {name: SpriteCacheRecord6, at: "0x7F42"}
    - {name: SpareCacheRecord, at: "0x7F52", comment: "A seventh record of the same layout, out of the search (B = 6)"}
