    - {at: "0xADD3-0xADDB", kind: code, title: "ScriptSaveFlags: keep F of the last word command for the conditions"}
    - {at: "0xADDC-0xADE8", kind: code, title: "ScriptWord: DE = the next word of the script"}
    - {at: "0xADE9-0xADF3", kind: code, title: "ScriptByte: C = the next byte of the script"}
    - {at: "0xADF4-0xAE0B", kind: code, title: "ScriptTest: carry when the condition A holds"}
    - {at: "0xAE0C-0xAE0D", kind: code, title: "CondAlways: condition 0: always (SCF)"}
    - {at: "0xAE0E-0xAE12", kind: code, title: "CondZero: condition 1: Z of the saved flags"}
    - {at: "0xAE13-0xAE17", kind: code, title: "CondNonZero: condition 2: NZ of the saved flags (the only one the scripts use)"}
    - {at: "0xAE18-0xAE1C", kind: code, title: "CondPositive: condition 5: P of the saved flags"}
    - {at: "0xAE1D-0xAE21", kind: code, title: "CondNegative: condition 6: M of the saved flags"}
    - {at: "0xAE22-0xAE23", kind: code, title: "CondCarry: condition 3: the saved carry"}
    - {at: "0xAE24-0xAE26", kind: code, title: "CondNoCarry: condition 4: the saved carry inverted"}
    - {at: "0xAE27-0xAE27", kind: code, title: "CmdNop: command 0: nothing (2 uses)"}
    - {at: "0xAE28-0xAE2D", kind: code, title: "CmdSetFlag: command 1: $81E3 = $FF (never used by the scripts)"}
    - {at: "0xAE2E-0xAE33", kind: code, title: "CmdScrollStop: command 2: the scroll stops (bit 5 of $81DA cleared; 9 uses)"}
    - {at: "0xAE34-0xAE39", kind: code, title: "CmdModeOn: command 3: bit 7 of the scroll flags $81DA set (never used)"}
    - {at: "0xAE3A-0xAE3F", kind: code, title: "CmdModeOff: command 4: bit 7 of the scroll flags cleared (never used)"}
    - {at: "0xAE40-0xAE53", kind: code, title: "CmdLevelEnd: command 5: the level is done"}
    - {at: "0xAE54-0xAE54", kind: code, title: "CmdNop2: command 6: nothing (never used)"}
    - {at: "0xAE55-0xAE5F", kind: code, title: "CmdStore: command 7: (word 1) = word 2 (80 uses, all on the counter $81E4)"}
    - {at: "0xAE60-0xAE6C", kind: code, title: "CmdCopy: command 8: (word 1) = (word 2) (never used)"}
    - {at: "0xAE6D-0xAE83", kind: code, title: "CmdDecrement: command 9: (word) - 1, the flags kept for the conditions (65 uses)"}
    - {at: "0xAE84-0xAE9A", kind: code, title: "CmdIncrement: command 10: (word) + 1, the flags kept (never used)"}
    - {at: "0xAE9B-0xAEAB", kind: code, title: "CmdTest: command 11: the flags of (word) (0 + word with ADC; never used)"}
    - {at: "0xAEAC-0xAEC2", kind: code, title: "CmdAdd: command 12: the flags of (word 1) + word 2 (never used)"}
    - {at: "0xAEC3-0xAED1", kind: code, title: "CmdReturn: command 13: return from a script call (never used)"}
    - {at: "0xAED2-0xAEE2", kind: code, title: "CmdCheckpoint: command 14: the checkpoint (11 uses)"}
    - {at: "0xAEE3-0xAF15", kind: code, title: "CmdResetRecords: command 15: reset the 18 records of 32 bytes at $F12C (8 uses)"}
    - {at: "0xAF16-0xAF25", kind: code, title: "CmdEnemyEscape: command 16: when the enemy record $F398 is active, EnemyEscaped $994A and FreeEnemySlot $992A..."}
    - {at: "0xAF26-0xAF48", kind: code, title: "CmdEnemiesLeft: command 17: NZ while one of the five enemies at $F398 lives (15 uses)"}
    - {at: "0xAF49-0xAF8F", kind: code, title: "LevelStart: the level banner and the scroll to the start point"}
    - {at: "0xAF90-0xAFAF", kind: code, title: "ReplayColumns: scroll BC columns, ReplayFast = A"}
    - {at: "0xAFB0-0xAFB6", kind: code, title: "InterruptSetup: the IM 2 table and a clear screen, once at the start"}
    - {at: "0xAFB7-0xB022", kind: code, title: "PlayersSetup: both player records and the level order of a new game"}
    - {at: "0xB023-0xB061", kind: code, title: "RoundSetup: a level's start: the checkpoint, the objects, the banner, the panel"}
    - {at: "0xB062-0xB094", kind: code, title: "SetLevelStart: a level's start into a player record's checkpoint"}
    - {at: "0xB095-0xB0C8", kind: code, title: "CreditsPage: the title page with both players' scores and the tune"}
    - {at: "0xB0C9-0xB0FD", kind: code, title: "HiScorePage: the high score table, 500 frames or fire"}
    - {at: "0xB0FE-0xB0FE", kind: data, title: "HiScoreSpare: a lone RET ($C9) no code reaches"}
    - {at: "0xB0FF-0xB110", kind: code, title: "EndOfPlay: after the play loop: dispatch on the end code"}
    - {at: "0xB111-0xB118", kind: pointer_table, title: "EndHandlers: the end codes 1-4: PlayerDied, LevelDone, AbortGame, AbortGame"}
    - {at: "0xB119-0xB148", kind: code, title: "PlayerDied: end code 1: a life lost"}
    - {at: "0xB149-0xB173", kind: code, title: "NextPlayer: the other player's turn, one life less"}
    - {at: "0xB174-0xB189", kind: code, title: "LevelDone: end code 2: the next level"}
    - {at: "0xB18A-0xB196", kind: code, title: "AbortGame: end codes 3 and 4: back to the title pages"}
    - {at: "0xB197-0xB1B3", kind: code, title: "Pause: the pause: fire resumes, Q aborts"}
    - {at: "0xB1B4-0xB1FF", kind: code, title: "PlayLoop: a life or a level of play"}
    - {at: "0xB200-0xB21B", kind: code, title: "MainLoop: the game's top loop"}
    - {at: "0xB21C-0xB28A", kind: code, title: "PlayerSetup: the player's ship and the objects tied to it"}
    - {at: "0xB28B-0xB2A9", kind: code, title: "EnemiesSetup: the five enemy records inactive, then the pod objects"}
    - {at: "0xB2AA-0xB2CE", kind: code, title: "PodsSetup: the three objects at $F474 tied to the ship"}
    - {at: "0xB2CF-0xB2EF", kind: code, title: "ShotsSetup: the four shot records inactive"}
    - {at: "0xB2F0-0xB30B", kind: code, title: "RequestEffect: ask for effect A (0 = stop), taken when not below the one playing"}
    - {at: "0xB30C-0xB445", kind: code, title: "EffectPlay: play CurrentEffect until it ends or a new request"}
    - {at: "0xB446-0xB4A8", kind: code, title: "TitleTune: play the title tune until fire or a key 1-5"}
    - {at: "0xB4A9-0xB4AC", kind: data, title: "TuneSpare: AND A; RET and two zeros no code reaches"}
    - {at: "0xB4AD-0xB4AE", kind: pointer_table, title: "TuneDuration: the note length in loop passes: the high byte set by the $C0+ commands, the low byte 0"}
    - {at: "0xB4AF-0xB54E", kind: sprite, title: "PodIcons: five 16 x 16 icons, 32 bytes each: the left cell's 8 lines, the right's, then the lower row's..."}
    - {at: "0xB54F-0xB6FE", kind: font, title: "Glyphs: 54 glyphs of 8 x 8, the print codes $80-$B5"}
    - {at: "0xB6FF-0xB72E", kind: code, title: "Start: the start: the code below the screen, the complemented graphics, the main loop"}
    - {at: "0xB72F-0xBBFF", kind: buffer, title: "MapRingSpace: The map ring from $B72F on (zero on the tape)"}
    - {at: "0xBC00-0xC3FF", kind: buffer, title: "TileSource: The 256 scenery tiles, as the start-up copies them to TileGraphics $5C00"}
    - {at: "0xC400-0xC7FF", kind: buffer, title: "WaveCellSource: The cells of the wave sprites, copied to $6400"}
    - {at: "0xC800-0xDFFF", kind: buffer, title: "GlyphCacheUpper: The glyph cache pages $C8-$DF (zero on the tape)"}
    - {at: "0xE000-0xE007", kind: sprite, title: "SpritePad: 8 bytes above the player's image (blank in play)"}
    - {at: "0xE008-0xE247", kind: sprite, title: "PlayerSprite: The player's ship: 8 shifts of 3 columns x 24 lines"}
    - {at: "0xE248-0xE487", kind: sprite, title: "SightSprite: The homing sight: 8 shifts of 3 columns x 24 lines"}
    - {at: "0xE488-0xE607", kind: sprite, title: "ExplosionFrames: The explosion: 8 frames of 2 columns x 24 lines"}
    - {at: "0xE608-0xE647", kind: sprite, title: "LaserSprite: The laser shot: 4 shifts (2 pixels apart) of 2 columns x 8 lines"}
    - {at: "0xE648-0xE747", kind: sprite, title: "BallSprite: The enemy shot and plasma ball: 8 shifts of 2 columns x 16 lines"}
    - {at: "0xE748-0xF047", kind: sprite, title: "SpriteCacheImages: The sprite cache images, also the panel's save area"}
    - {at: "0xF048-0xF107", kind: sprite, title: "PodSprite: The weapon pod: 4 shifts (2 pixels apart) of 3 columns x 16 lines"}
    - {at: "0xF108-0xF12B", kind: records, title: "RecordsGap: 36 bytes nothing uses"}
    - {at: "0xF12C-0xF36B", kind: records, title: "RowRecords: The 18 row records of the playfield, 32 bytes each"}
    - {at: "0xF36C-0xF397", kind: records, title: "PlayerObject: The player's ship record (kind 0)"}
    - {at: "0xF398-0xF473", kind: records, title: "EnemyObjects: The five enemy records (kinds 2, 8, 11 and the cache kinds)"}
    - {at: "0xF474-0xF4F7", kind: records, title: "EnemyShots: The three enemy shot records (kind 5, BallSprite)"}
    - {at: "0xF4F8-0xF5A7", kind: records, title: "LaserShots: The four laser shot records (kind 1, LaserSprite)"}
    - {at: "0xF5A8-0xF5D3", kind: records, title: "PlasmaBall2: The second plasma ball (the double plasma)"}
    - {at: "0xF5D4-0xF5FF", kind: records, title: "SideShot: The side weapon's shot: plasma ball, homing missile or seeker"}
    - {at: "0xF600-0xF62B", kind: records, title: "SightObject: The homing sight (kind 6, SightSprite)"}
    - {at: "0xF62C-0xF7FF", kind: records, title: "StripBuffers: The objects' strip entries, 12 bytes each"}
    - {at: "0xF800-0xFAFF", kind: buffer, title: "NodePool: 95 span nodes of 8 bytes"}
    - {at: "0xFB00-0xFBFF", kind: buffer, title: "BitReverse: 256 bytes, each the bit reverse of its index"}
    - {at: "0xFC00-0xFCFF", kind: buffer, title: "HitGridX: The collision grid: one byte a column (play) / the menu's raster colours"}
    - {at: "0xFD00-0xFD8F", kind: buffer, title: "HitGridY: The Y half of the collision grid"}
    - {at: "0xFD90-0xFDFA", kind: data, title: "ScriptStack: The scenery script's stack (down from $FDFB)"}
    - {at: "0xFDFB-0xFDFC", kind: pointer_table, title: "ScriptStackTop: The scenery script's first return address"}
    - {at: "0xFDFD-0xFDFF", kind: data, title: "InterruptJump: JP to the frame handler, where every IM 2 interrupt lands"}
    - {at: "0xFE00-0xFF00", kind: data, title: "VectorTable: The IM 2 vector table: 257 bytes of $FD"}
    - {at: "0xFF01-0xFF1B", kind: music, title: "TunePeriods: the period of each note number, in loop passes (index 0 unused)"}
    - {at: "0xFF1C-0xFF29", kind: music, title: "TuneOrder: the patterns in play order: A A B A C C D"}
    - {at: "0xFF2A-0xFF60", kind: music, title: "TunePatternA: pattern A (played 3 times): the opening phrase"}
    - {at: "0xFF61-0xFF9B", kind: music, title: "TunePatternB: pattern B: the climbing arpeggios"}
    - {at: "0xFF9C-0xFFAD", kind: music, title: "TunePatternC: pattern C (twice): the ostinato"}
    - {at: "0xFFAE-0xFFD3", kind: music, title: "TunePatternD: pattern D: the closing phrase"}
    - {at: "0xFFD4-0xFFD6", kind: variable, title: "FontLeftover: the lines 4-6 of the ROM's 'P' ($7C, $40, $40), no code reads them"}
    - {at: "0xFFD7-0xFFD7", kind: variable, title: "Invulnerable: the developer switch: not 0 = the ship cannot be killed"}
    - {at: "0xFFD8-0xFFDF", kind: variable, title: "WorkGlyph: an 8-byte work cell: $8EC5 copies a glyph of $72A9 + 8 n here, $8EA1 draws it (on the tape: t..."}
    - {at: "0xFFE0-0xFFFF", kind: variable, title: "ColumnFlags: 32 flags a screen column (to $FFFF, past the image): cleared by $8C3B at each level start ($8..."}
  labels:
    - {name: TileCopyTail, at: "0x61A8", comment: "The tile set and sprite glyphs from $61A8 on (zeros on the tape, copied from $C1A8 by Start)"}
