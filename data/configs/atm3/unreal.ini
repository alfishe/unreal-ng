[ROM]
GS=rom/gs105a.rom
MOONSOUND=rom/opl4/yrw801-m-yamaha-1993.rom
ATM3=rom/zxevo-fe.rom
; NO ROMSET for ATM3/ZX-Evo: the whole 512K image loads raw and the standard
; set is the LAST 4 pages (reference unrealspeccy config.cpp:
; lastpage = ROM_BASE + (romsize-64)K). zxevo-fe.rom is the official NedoPC
; BaseConf image (pentevo rom/zxevo_fe.rom, build_full.bat):
;   pages 0-3   = empty custom-ROM slot
;   pages 4-7   = ATM CP/M, BASIC48 for 128, BASIC128, BASIC48
;   pages 8-11  = GLUK (2006 BASIC48, TR-DOS 6.10, BASIC128, Gluk Reset Service)
;   pages 12-19 = ProfROM
;   pages 22-26 = ERS RST8 services + packed main menu
;   page 28 = BASIC48 (sos), 29 = NEO-DOS (TR-DOS 5.03 family, dos),
;   page 30 = BASIC128 (128), 31 = EVO Reset Service start page (sys)
; The older custom rom/zxevo.rom (TR-DOS 5.04T in pages 0-3, earlier ERS)
; needs [EVO] Fpga=legacy.
; (ROMSET would load only 4 banks and lose the rest of the image.)

