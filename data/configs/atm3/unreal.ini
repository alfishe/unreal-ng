[ULA]
Frame=69888   ; t-states in frame (312 lines * 224 T at the base clock, the FF77.3 7 MHz turbo multiplies the CPU only)
Line=224      ; t-states in line
int=50        ; int freq
intstart=1756 ; INT fires at 1757 (>1756): 14395T to ZX paper at T=16152 (UnrealSpeccy PRESET.ATM1_2_3.5MHz by DDp, Xpeccy ULA.ATM2 gives 14384T)
intlen=32     ; int length in t-states
EvenM1=0
4TBorder=0
FloatBus=0
FloatDOS=0
PortFF=1

Preset=ATM1_2_3.5MHz

PRESET.ATM1_2_3.5MHz=69888,14395,224,50,32,0,0,0,0,1
; UnrealSpeccy-only: it has no CPU turbo, so it fakes ~5 MHz by stretching the frame at a fixed 50 Hz.
; Here the frame length sets the frame period (99880 T = 35.04 FPS), so this preset must not be used.
; PRESET.ATM1_2_7.0MHz=99880,17989,224,50,32,0,0,0,0,1

AtmMemSwap=0
