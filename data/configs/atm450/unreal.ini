[*] unreal speccy configuration file

UNREAL=0.37.9   ; make sure you don't have old INI version

[MISC]
ShareCPU=1
HighPriority=1
HIMEM=ATM450
RAMSize=512                    ; the 4.50 board takes 16 x 565RU7 = 512 KiB (ATM manual)
; RAM contents at power-on: RANDOM (noise in the screen pages 5 and 7, like real DRAM; other
;   pages zero) or ZERO (every RAM page reads 0: reproducible runs for tests and scripts)
RAMPowerOn=RANDOM

ULAPLUS=NONE
TS_VDAC=NONE
TS_VDAC2=0
OUT_C_0=0
Z80_VM1=0
TapeTraps=1
TapeAutoStart=1
CMOS=NONE                      ; no clock chip on the 4.50 board
Cache=0
EFF7mask=0
SMUC=0
RESET=128                      ; every mode except DOS starts in the system ROM (CPSYS set at reset)
ZC=0                           ; no Z-Controller on the 4.50 board
HideConsole=0
ConfirmExit=0
Help=help_eng.html
DIR=.
SPGMemInit=0
Modem=NONE
ZiFi=NONE

[AUTOLOAD]
diskA=boot.$b
diskB=
diskC=
diskD=
DefaultDrive=Auto

[INPUT]
ZXKeyMap=default
KeybLayout=default
KeybPCMode=0
Mouse=KEMPSTON
Wheel=KEMPSTON
JoyMouse=0
MouseScale=0
SwapMouse=0
KJoystick=1
Matrix=1
Fire=KFIRE
FireRate=1
AltLock=1
ATMKBD=1
Joy=0
HoldDelay=2
ReleaseDelay=5
NewlineDelay=20

[ULA]
; ATM Turbo 2 v4.50: 308 lines x 224 T, not the 312 of the 7.10 - the system ROM's frame-timing protection
; corrupts typed keys with 312 lines (docs/inprogress/2026-10-01-atm450/frame-timing-protection.md)
Frame=68992   ; t-states in frame (308 lines * 224 T)
Line=224      ; t-states in line
int=50        ; int freq
intstart=860  ; INT fires at 861 (>860): 14395T to ZX paper at T=15256 (line 68 * 224 + 24; 20 blank lines before the visible area)
intlen=32     ; int length in t-states
EvenM1=0
4TBorder=0
FloatBus=0
FloatDOS=0
PortFF=1

Preset=ATM450_3.5MHz

PRESET.ATM450_3.5MHz=68992,14395,224,50,32,0,0,0,0,1
; UnrealSpeccy-only: it has no CPU turbo, so it fakes ~5 MHz by stretching the frame at a fixed 50 Hz.
; Here the frame length sets the frame period (99880 T = 35.04 FPS), so this preset must not be used.
; PRESET.ATM1_2_7.0MHz=99880,17989,224,50,32,0,0,0,0,1

AtmMemSwap=0
UsePalette=1
ProfiMonochrome=0

[VIDEO]
VSync=0
FullScr=0
Refresh=0
Border=3
NoFlic=0
AltNoFlic=0
FlashColor=0
MinRes=480
ChunkSize=auto
PixelScroll=0
rsm.frames=4
rsm.mode=2C
scale=2
winscale=1
video=double
driver=gdi
fastlines=0
ScanIntens=100
Hide=
Update=1
SkipFrame=0
SkipFrameMaxSpeed=64
ScrShot=PNG
ScrShotDir=.
DetectModel=0
AtariPreset=none
ffmpeg.exec=ffmpeg.exe
ffmpeg.newconsole=1
ffmpeg.parm=-c:a libmp3lame -b:a 320k -af volume=3.000000 -c:v libx264 -pix_fmt yuvj420p -preset:v veryfast -profile:v baseline -crf 10 -ss 00:00:00.500
ffmpeg.vout=video#.avi

[BETA128]
Beta128=1
Noise=1
Traps=1
Fast=1
IL=1
BOOT=boot.$b

[SOUND]
SoundFilter=0
SoundDrv=ds
RejectDC=1
SoundBuffer=auto
DSPrimary=0
Enabled=1
Fq=44100
GSType=NGS     ; NGS (NeoGS, shipped on every model), Z80 (classic GS), LW (lightweight player), BASS (= LW) or NONE
GSRamSize=512   ; classic GS card RAM in KB (128 stock / 256 / 512 expansion) - 512 for
                ; big-module software (Nether Earth GS); pentagon boots are slow enough
                ; to clear the longer 512 KB POST before probing the card
GSReset=1
SD=1
CovoxFB=1
CovoxDD=0
Saa1099=0
MoonSound=1
BeeperVol=8192
MicOutVol=1000
MicInVol=1000
AYVol=6144
CovoxFBVol=8192
CovoxDDVol=6000
CovoxProfiVol=6000
SDVol=4000
GSVol=8000
BASSVol=8000
MoonSoundVol=8000

[NGS]                          ; NeoGS card, fitted with [SOUND] GSType=NGS
Flash=rom/neogs/full_ngs.rom   ; 512 KB flash image: loader, main ROM, FPGA configuration
FlashId=st                     ; flash chip ID: st (20/E2, as fitted) | amd (01/A4)
Fpga=current                   ; board: current | D (old 2 MB boards, 2008-2013)
RamSize=2048                   ; card RAM in KB: 2048 | 4096
Boot=loader                    ; loader (the flash loader, boots NEOGS.ROM from SD) | direct (main ROM at once)
BootDelayMs=0                  ; extra delay before the card starts, ms (the real FPGA loads in about 1 s)
SDCardImage=                   ; SD card (slot sd.ngs): FAT16 / FAT32 image or a host folder, empty = no card; [MEDIA] sd.ngs wins
SDType=auto                    ; auto (by image size) | sdsc | sdhc
SDWriteProtect=0               ; 1 = the write-protect switch reads as on
SDWrite=session                ; session (kept until exit) | persist (written to the image) | off (refused)
MP3Support=software            ; none (no decoder) | stub (takes data, silent) | software (decodes and plays)
Mp3Chip=vs1001                 ; vs1001 | vs1011
Mp3Gain=1.0                    ; MP3 output gain, 0.0-8.0
FlashWrite=session             ; session (kept until exit) | persist (saved in the settings folder) | off (ignored)
Volume=8000                    ; card output, the same 0-8192 scale as [SOUND] GSVol
ZxDmaWatch=selected            ; ZX-DMA watch: selected (while the ZX program talks to the card) | always
ZxDmaWatchFrames=5             ; frames the watch stays on after the last ZX-DMA activity
StereoMode=separated           ; DAC channels: separated (as on the board) | gs (50% cross-feed, like the classic GS) | mono

[SAA1099]
FQ=8000000

[AY]
Chip=YM2203
FQ=1774400
Stereo=ABC
VolTab=default.YM
UseSamples=0
Scheme=AYX32
STEREO.ABC=100,10,66,66,10,100
STEREO.ACB=100,10,10,100,66,66
STEREO.BAC=66,66,100,10,10,100
STEREO.mono=66,66,66,66,66,66
STEREO.unreal=90,20,66,66,20,90
VOLTAB.default.AY=0000,0340,04C0,06F2,0A44,0F13,1510,227E,289F,414E,5B21,7258,905E,B550,D7A0,FFFF
VOLTAB.default.YM=0000,0000,00EF,01D0,0290,032A,03EE,04D2,0611,0782,0912,0A36,0C31,0EB6,1130,13A0,1751,1BF5,20E2,2594,2CA1,357F,3E45,475E,5502,6620,7730,8844,A1D2,C102,E0A2,FFFF

[COLORS]
color=ATM
ATM=00,55,AA,E0,FF,80:100,00,00;00,100,00;00,00,100

[HDD]
Scheme=ATM
SkipReal=1
CDROM=
Image0=          ; an image (.img .hdf .hdi .vhd .chd; .iso .cue .chd for a CD) or a folder (or ide0.master in the MEDIA section)
CHS0=0/0/0       ; 0/0/0: from the image header, else from its size
LBA0=0
HD0RO=0
CD0=0            ; 1: the master is an ATAPI CD-ROM drive (auto when Image0 is an .iso or a .cue)
Image1=
CHS1=1937/16/63
LBA1=1950720
HD1RO=0
CD1=0            ; 1: the slave is an ATAPI CD-ROM drive (auto when Image1 is an .iso or a .cue)

[ROM]
GS=rom/gs105a.rom
MOONSOUND=rom/opl4/yrw801-m-yamaha-1993.rom
ATM1=rom/atm1.rom
ROMSET=ROM.ATM1

; Page order verified against the image: 0 = system (CP/M BIOS), 1 = TR-DOS 5.03,
; 2 = 128 menu, 3 = 48 BASIC (docs/inprogress/2026-10-01-atm450/requirements.md R3)
[ROM.ATM1]
title=ATM Turbo 2 v4.50
sys=rom/atm1.rom:0
dos=rom/atm1.rom:1
128=rom/atm1.rom:2
sos=rom/atm1.rom:3

[LEDS]
leds=1
status=1
KBD_AY=0
AY=1:1,1
Perf=1:1,-11
PerfShowT=0
LOAD=1:-24,1
Input=1:20,1
Time=1:-32,-10
OSW=0:-50,26
MemBand=0:60,3
BandBpp=256

[NETWORK]                      ; network adapters (docs/inprogress/2026-09-30-nedoos-integration/tdd-network.md)
Card=NONE                      ; ZX-Bus cards, a list with ',': NONE | ZXNETUSB (NedoPC W5300, #xxAB; NedoOS sd_boot.$C) | ZXWIFI (16550 + ESP, #xxEF)
HostAccess=1                   ; 1 = the virtual network reaches the host network | 0 = internal only (DHCP, DNS hosts table)
DnsMode=HOST                   ; HOST (DNS queries answered by the host resolver) | PASS (sent as plain UDP)
Hosts=                         ; names answered by the virtual network: name=a.b.c.d,name=a.b.c.d
Forward=                       ; guest servers: tcp:<hostport>:<guestport>,... (guest ports >= 1024 use the same host port)
RemoteAccess=on                ; guest servers listen on 0.0.0.0 (other computers on the LAN can connect) | off = 127.0.0.1 only
ConnectTimeoutMs=10000         ; host TCP connect timeout
ComPort=NONE                   ; (no serial port on the 4.50 board) the machine's own serial port (ZX-Evo: the AVR's 16550 on #F8EF..#FFEF): NONE | LOOPBACK | TCP:<host>:<port> | SERIAL:<device>[,<baud>] | ESPNET | AT
ZxWifi=AT                      ; Card=ZXWIFI: what the card's 16550 (#F8EF..#FFEF) is wired to - AT | ESPNET (its ESP's firmware) or a ComPort= value
ComModemLines=0                ; 1 = a SERIAL: device gets RTS / DTR and reports CTS / DSR / RI / DCD (0: USB ESP boards wire RTS / DTR to reset / boot)
EspChip=ESP32                  ; an emulated ESP (ComPort= / ZxWifi= ESPNET or AT): ESP32 (8 sockets) | ESP8266 (4 sockets)
