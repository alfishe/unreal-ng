      <stop offset="0" stop-color="#d0bfff"/>
      <stop offset="0.25" stop-color="#99e9f2"/>
      <stop offset="0.45" stop-color="#f8f9fa"/>
      <stop offset="0.6" stop-color="#ffec99"/>
