name: CMake CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'data/**'
      - 'testdata/**'
      - '.gitignore'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'data/**'
      - 'testdata/**'
      - '.gitignore'

env:
  BUILD_TYPE: Release
  # LD_LIBRARY_PATH is already set correctly inside the Docker image,
  # so we don't need to override it here.

jobs:
  build-linux:
    runs-on: ubuntu-latest # <--- The VM that runs Docker

    # 1. TELL GITHUB TO RUN INSIDE YOUR IMAGE
    container:             # <--- Custom environment inside the VM
      image: ghcr.io/alfishe/unreal-ng:qt6.9.3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build project
        run: |
          # 2. FIX GIT PERMISSIONS
          # GitHub mounts the code as a volume; git inside the container 
          # requires this to trust the directory ownership.
          git config --global --add safe.directory $GITHUB_WORKSPACE

          # 3. BUILD
          # Based on your previous script, source is in 'unreal-qt' folder
          cd unreal-qt
          
          # Use Ninja (installed in your image) for faster builds.
          # TESTS=ON pulls in core/tests (where the TTD divergence corpus
          # and capture-cost CI gate live — see core/tests/debugger/ttd/).
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DTESTS=ON
          jobs=$(( $(nproc) / 2 ))
          cmake --build build --target core-tests --parallel "$(( jobs > 0 ? jobs : 1 ))"


      - name: Run TTD regression tests
        # Phase 2 Item 7 (parent TDD §15.1) — gate the TTD engine on every
        # commit. Two suites:
        #   * TTD_Divergence_Corpus_Test — capture/restore round-trip on
        #     Dizzy Y (idle) and AccuracyCoinZX (self-modifying code).
        #   * TTDBench_Test — the "ci" subset of the TTD benchmark matrix
        #     (PLAN #40 Phase 0, Step 2): bytes per stream vs testdata/ttd/bench/
        #     v1-ci-gate.txt, counted capture work vs the same file, seek and
        #     save/load. No clock is asserted, so a loaded runner cannot fail it.
        run: |
          cd unreal-qt
          ./build/bin/core-tests \
            --gtest_filter='TTD_Divergence_Corpus_Test.*:*TTDBench*' \
            --gtest_color=no