name: CMake CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'data/**'
      - 'testdata/**'
      - '.gitignore'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'data/**'
      - 'testdata/**'
      - '.gitignore'

# gh api in the throttle job reads this workflow's runs
permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  # LD_LIBRARY_PATH is already set correctly inside the Docker image,
  # so we don't need to override it here.

jobs:
  # Pushes to master build at most once per CI_MIN_INTERVAL_MINUTES (repository variable, Settings -> Secrets and
  # variables -> Actions -> Variables; default 60, 0 = no throttle). A push that comes too early waits here; a newer push
  # cancels the waiting one (concurrency below), so only the newest commit of a burst gets built. Builds that already
  # started are never cancelled. Pull requests are always built at once: no wait, and a group of their own so nothing cancels them.
  throttle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # No concurrency here — let all throttle jobs wait in parallel. The first one past the
    # interval starts its build; concurrency on build-linux (below) cancels any stragglers.
    env:
      GH_TOKEN: ${{ github.token }}
      MIN_INTERVAL: ${{ vars.CI_MIN_INTERVAL_MINUTES || '60' }}
    steps:
      - name: Wait for the build interval
        if: github.event_name == 'push'
        run: |
          set -eu
          interval=$(( MIN_INTERVAL * 60 ))
          if [ "$interval" -le 0 ]; then echo "throttle off"; exit 0; fi
          # Find the most recent run where build-linux actually started (any conclusion — even
          # cancelled runs count if the build job began). Fix type mismatch: .id is a number,
          # $GITHUB_RUN_ID is a string — tonumber makes jq compare correctly.
          last=0
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cmake-ci.yml/runs?per_page=50" \
                         --jq ".workflow_runs[] | select(.id != ($GITHUB_RUN_ID | tonumber) and .head_branch == \"master\" and .event == \"push\") | .id"); do
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                        --jq '[.jobs[] | select(.name == "build-linux" and .started_at != null) | .started_at][0] // empty')
            [ -n "$started" ] || continue
            t=$(date -u -d "$started" +%s)
            if [ "$t" -gt "$last" ]; then
              last=$t
              echo "Found build-linux in run $run started at $started (epoch $t)"
            fi
          done
          now=$(date -u +%s)
          wait=$(( last + interval - now ))
          if [ "$wait" -gt 0 ]; then
            echo "Last build started $(( (now - last) / 60 )) min ago; waiting $(( wait / 60 )) min (CI_MIN_INTERVAL_MINUTES=$MIN_INTERVAL)"
            sleep "$wait"
          else
            echo "No build in the last $MIN_INTERVAL min (last=$last, now=$now)"
          fi

  build-linux:
    needs: throttle
    runs-on: ubuntu-latest # <--- The VM that runs Docker
    concurrency:
      group: ci-build-linux-${{ github.event_name == 'push' && 'master' || github.run_id }}
      cancel-in-progress: true

    # 1. TELL GITHUB TO RUN INSIDE YOUR IMAGE
    container:             # <--- Custom environment inside the VM
      image: ghcr.io/alfishe/unreal-ng:qt6.9.3-ubuntu24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build project
        run: |
          # 2. FIX GIT PERMISSIONS
          # GitHub mounts the code as a volume; git inside the container 
          # requires this to trust the directory ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # 3. BUILD
          # Based on your previous script, source is in 'unreal-qt' folder
          cd unreal-qt
          
          # Use Ninja (installed in your image) for faster builds.
          # TESTS=ON pulls in core/tests (where the TTD divergence corpus
          # and capture-cost CI gate live — see core/tests/debugger/ttd/).
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DTESTS=ON
          cmake --build build --target core-tests --parallel


      - name: Run TTD regression tests
        # Phase 2 Item 7 (parent TDD §15.1) — gate the TTD engine on every
        # commit. Two suites:
        #   * TTD_Divergence_Corpus_Test — capture/restore round-trip on
        #     Dizzy Y (idle) and AccuracyCoinZX (self-modifying code).
        #   * TTDBench_Test — the "ci" subset of the TTD benchmark matrix
        #     (PLAN #40 Phase 0, Step 2): bytes per stream vs testdata/ttd/bench/
        #     v1-ci-gate.txt, counted capture work vs the same file, seek and
        #     save/load. No clock is asserted, so a loaded runner cannot fail it.
        run: |
          cd unreal-qt
          ./build/bin/core-tests \
            --gtest_filter='TTD_Divergence_Corpus_Test.*:*TTDBench*' \
            --gtest_color=no
  # Newest GCC (official gcc image). The packaging image stays on gcc 14 so the
  # Linux packages run on Ubuntu 24.04; this job catches what the next compilers
  # reject and runs the whole core test suite. Core only - no Qt needed.
  build-gcc-latest:
    needs: throttle
    runs-on: ubuntu-latest
    container: gcc:16
    concurrency:
      group: ci-build-gcc-${{ github.event_name == 'push' && 'master' || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build uuid-dev libssl-dev zlib1g-dev

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build core-tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gcc --version | head -1
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_QT_APPS=OFF \
            -DTESTS=ON
          cmake --build build --target core-tests --parallel

      - name: Run core-tests (all, sharded)
        run: cmake --build build --target test-parallel
